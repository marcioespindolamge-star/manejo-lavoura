name: Clarear Estoque
on:
  push:
    paths:
      - '.github/workflows/clarear-estoque.yml'
      - 'scripts/clarear_estoque.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar mudancas
        run: python scripts/clarear_estoque.py
      - name: Publicar no codigo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deixa estoque e entradas mais claros"
          git push
