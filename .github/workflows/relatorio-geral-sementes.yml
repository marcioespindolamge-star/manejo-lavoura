name: Corrigir relatorio geral
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          alvo='<section id="relatorios" class="page"><h2>RELATÓRIO POR LAVOURA</h2>'
          novo=alvo+'<div class="card no-print"><button class="btn pri" onclick="relatorioGeralSementes()">RELATÓRIO GERAL DE SEMENTES</button></div><div id="relGeralSementes"></div>'
          if 'RELATÓRIO GERAL DE SEMENTES</button>' not in s: s=s.replace(alvo,novo,1)
          if 'function relatorioGeralSementes()' not in s:
              fn="""function relatorioGeralSementes(){let total=db.safras.reduce((t,v)=>t+(n(v.sementeTotalKg)||(n(v.sementeKgHa)*n(lav(v.lavouraId)?.area))),0);$('relGeralSementes').innerHTML='<div class="card"><h2 style="text-align:center">RELATÓRIO GERAL DE SEMENTES</h2><div class="summary"><b>QUANTIDADE TOTAL DE SEMENTES: '+total.toLocaleString('pt-BR',{maximumFractionDigits:2})+' kg</b><br><b>TOTAL EM SACAS DE 60 KG: '+(total/60).toLocaleString('pt-BR',{maximumFractionDigits:2})+' sacas</b></div><div class="actions no-print"><button class="btn pri" onclick="window.print()">Imprimir</button></div></div>';}"""
              s=s.replace('function renderRel()',fn+'function renderRel()',1)
          p.write_text(s,encoding="utf-8")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Corrige geracao do relatorio geral" || exit 0
          git push
