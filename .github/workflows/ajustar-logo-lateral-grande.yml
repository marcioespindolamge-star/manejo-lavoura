name: Ajustar logo lateral grande

on:
  push:
    paths:
      - '.github/workflows/ajustar-logo-lateral-grande.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar brasao na lateral
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.nav-logo{margin-top:22px;display:flex;justify-content:center;align-items:center;padding:8px;height:166px;min-height:166px;flex:0 0 166px;overflow:visible}.nav-logo img{display:block;width:150px;height:150px;min-width:150px;min-height:150px;max-width:150px;max-height:150px;object-fit:contain;object-position:center;border-radius:50%;flex:0 0 150px}'
          new='.nav-logo{margin-top:18px;display:flex;justify-content:center;align-items:center;width:100%;padding:8px 0 12px;min-height:205px;height:205px;flex:0 0 205px;overflow:visible}.nav-logo img{display:block;width:190px;height:190px;min-width:190px;min-height:190px;max-width:190px;max-height:190px;object-fit:contain;object-position:center;border-radius:50%;flex:0 0 190px}'
          if old not in s:
              raise SystemExit('CSS atual do logo nao encontrado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Salvar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Ajusta brasao grande e inteiro na lateral"
          git push
