name: Adicionar editar e excluir lavouras

on:
  push:
    paths:
      - '.github/workflows/editar-excluir-lavouras.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Implementar edicao e exclusao de lavouras
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* LAVOURAS_EDITAR_EXCLUIR_V1 */'
          if marker in s:
              raise SystemExit(0)
          patch=r'''
<script>
/* LAVOURAS_EDITAR_EXCLUIR_V1 */
let lavEditId='';
function cancelarEdicaoLavoura(){
  lavEditId='';
  $('fLav').reset();
  const b=document.getElementById('lavCancelar'); if(b)b.style.display='none';
  const s=document.getElementById('lavSalvar'); if(s)s.textContent='Salvar';
}
function editarLavoura(id){
  const l=db.lavouras.find(x=>String(x.id)===String(id)); if(!l)return;
  lavEditId=l.id;
  $('lavCodigo').value=l.codigo||''; $('lavNome').value=l.nome||''; $('lavArea').value=l.area||'';
  const b=document.getElementById('lavCancelar'); if(b)b.style.display='inline-block';
  const s=document.getElementById('lavSalvar'); if(s)s.textContent='Salvar alteração';
  $('lavCodigo').focus();
}
function excluirLavoura(id){
  const l=db.lavouras.find(x=>String(x.id)===String(id)); if(!l)return;
  const usada=(db.safras||[]).some(x=>String(x.lavouraId)===String(id))||(db.aplicacoes||[]).some(x=>String(x.lavouraId)===String(id))||(db.manejos||[]).some(x=>String(x.lavouraId)===String(id));
  if(usada)return alert('Esta lavoura possui variedade ou manejo registrado e não pode ser excluída.');
  if(!confirm('Excluir a lavoura '+(l.nome||l.codigo)+'?'))return;
  db.lavouras=db.lavouras.filter(x=>String(x.id)!==String(id)); save(); cancelarEdicaoLavoura(); renderAll();
}
function renderLav(){
  $('totalLav').innerHTML='<b>Área total cadastrada:</b> '+db.lavouras.reduce((a,l)=>a+n(l.area),0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ha';
  $('tblLav').innerHTML='<table><tr><th>Código</th><th>Nome</th><th>Área (ha)</th><th>Ações</th></tr>'+db.lavouras.map(l=>'<tr><td>'+esc(l.codigo||'')+'</td><td>'+esc(l.nome||'')+'</td><td>'+n(l.area).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'</td><td><button class="btn" type="button" onclick="editarLavoura(\''+l.id+'\')">Editar</button> <button class="btn danger" type="button" onclick="excluirLavoura(\''+l.id+'\')">Excluir</button></td></tr>').join('')+'</table>';
}
(function(){
 const f=$('fLav'); if(!f)return;
 const actions=f.querySelector('.actions');
 if(actions && !document.getElementById('lavCancelar')) actions.innerHTML='<button type="button" id="lavCancelar" class="btn" style="display:none" onclick="cancelarEdicaoLavoura()">Cancelar</button><button id="lavSalvar" class="btn pri">Salvar</button>';
 f.onsubmit=function(e){
   e.preventDefault();
   const codigo=$('lavCodigo').value.trim(), nome=$('lavNome').value.trim(), area=n($('lavArea').value);
   if(!codigo||!nome||area<=0)return alert('Preencha código, nome e área da lavoura.');
   const duplicada=db.lavouras.some(x=>String(x.id)!==String(lavEditId)&&String(x.codigo||'').toLowerCase()===codigo.toLowerCase());
   if(duplicada)return alert('Já existe uma lavoura com este código/nome.');
   if(lavEditId){
     const l=db.lavouras.find(x=>String(x.id)===String(lavEditId)); if(l){l.codigo=codigo;l.nome=nome;l.area=area;}
   }else db.lavouras.push({id:uid(),codigo,nome,area});
   save(); cancelarEdicaoLavoura(); renderAll();
 };
 renderLav();
})();
</script>
'''
          s=s.replace('</body>',patch+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Salvar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Adiciona Editar e Excluir nas lavouras cadastradas"
          git push
