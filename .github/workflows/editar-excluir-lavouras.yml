name: Aplicar correcoes finais no sistema

on:
  push:
    paths:
      - '.github/workflows/editar-excluir-lavouras.yml'
      - 'scripts/aplicar_correcoes.py'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcoes
        run: python scripts/aplicar_correcoes.py
      - name: Salvar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Implementa Editar Excluir e corrige brasao lateral"
          git push
