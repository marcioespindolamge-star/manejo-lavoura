name: Redimensionar para iPhone

on:
  push:
    paths:
      - '.github/workflows/mobile-header-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar menu do iPhone
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          mobile='''@media(max-width:760px){html,body{width:100%;max-width:100%;overflow-x:hidden}body{font-size:12px}header{height:48px;padding:0 6px;border-bottom-width:3px}.head{padding:2px 4px}.head h1{font-size:15px;line-height:1;margin:1px 0}.head b{font-size:6px;letter-spacing:1px;margin-bottom:1px}.head small{display:none}.layout{display:block;min-height:calc(100vh - 48px)}nav{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;padding:4px 5px;overflow:visible}nav button{min-width:0;width:100%;padding:6px 2px;border-radius:6px;font-size:8.6px;line-height:1.05;text-align:center;white-space:normal;overflow-wrap:anywhere}nav button:nth-child(1),nav button:nth-child(2),nav button:nth-child(3){grid-column:span 2}nav button:nth-child(4){grid-column:2/span 2}nav button:nth-child(5){grid-column:4/span 2}nav button.active{box-shadow:inset 0 -3px var(--y)}main{padding:6px}.page>h2{font-size:15px;margin:5px 0 7px}.card{padding:7px;border-radius:8px;margin-bottom:7px;box-shadow:0 2px 8px #1c422b0d}.grid{display:block}.s4,.s8{width:100%}.r2{grid-template-columns:1fr 1fr;gap:5px}.date-row,.product-row{grid-template-columns:1fr;gap:3px}label{font-size:8.5px;margin:2px 0 3px}input,select{font-size:16px;padding:5px 7px;min-height:33px;border-radius:6px;margin-bottom:5px}.btn{padding:5px 7px;border-radius:6px;font-size:9.5px;min-height:30px}.actions{gap:4px}.area-total,.summary{padding:6px;border-radius:7px;margin-bottom:6px;font-size:10.5px}.step{padding-top:7px;margin-top:7px}.lav-list,.prod-list{grid-template-columns:1fr;gap:4px;margin-top:4px}.choice{padding:6px;border-radius:7px;font-size:10.5px}.choice label{font-size:10.5px;text-transform:none;margin:0}.choice input[type=checkbox]{transform:scale(1);margin-right:4px}.subhead{font-size:12.5px;margin:10px 0 5px}#tblLav,#tblVar,#tblPro,#tblCompras,.board{overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;border-radius:7px}table{font-size:9.5px;min-width:460px}th,td{padding:4px;white-space:nowrap}.board table{min-width:700px}.board th,.board td{white-space:normal;min-width:86px;padding:4px}.timeline{padding-left:9px}.event{padding:6px;margin-bottom:5px;font-size:10.5px}.tag{font-size:8px;padding:2px 4px}}'''
          tiny='''@media(max-width:390px){header{height:44px}.head h1{font-size:13.5px}.head b{font-size:5.4px}.layout{min-height:calc(100vh - 44px)}nav{padding:3px 4px;gap:2px}nav button{font-size:7.8px;padding:5px 1px}main{padding:5px}.card{padding:6px}.page>h2{font-size:14px}.r2{gap:4px}table{font-size:9px;min-width:440px}}'''

          s=re.sub(r'@media\(max-width:760px\)\{.*?\}(?=@media\(max-width:390px\))',mobile,s,count=1,flags=re.S)
          s=re.sub(r'@media\(max-width:390px\)\{.*?\}(?=@media print)',tiny,s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Gravar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Ajusta menu do iPhone em grade 3 mais 2"
          git push
