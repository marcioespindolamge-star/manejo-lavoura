name: Redimensionar para iPhone

on:
  push:
    paths:
      - '.github/workflows/mobile-header-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redimensionar interface para iPhone
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Mantem desktop intacto e ajusta apenas celular.
          mobile='''@media(max-width:760px){html,body{width:100%;max-width:100%;overflow-x:hidden}body{font-size:13px}header{height:50px;padding:0 6px;border-bottom-width:3px}.head{padding:2px 4px}.head h1{font-size:15px;line-height:1;margin:1px 0;letter-spacing:0}.head b{font-size:6px;letter-spacing:1px;margin-bottom:1px}.head small{display:none}.layout{display:block;min-height:calc(100vh - 50px)}nav{position:sticky;top:0;z-index:20;display:flex;flex-direction:row;gap:3px;overflow-x:auto;white-space:nowrap;padding:4px 5px;-webkit-overflow-scrolling:touch;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{flex:0 0 auto;min-width:auto;padding:6px 7px;border-radius:6px;font-size:9.5px;line-height:1;text-align:center;white-space:nowrap}nav button.active{box-shadow:inset 0 -3px var(--y)}main{padding:7px}.page>h2{font-size:16px;margin:6px 0 8px}.card{padding:8px;border-radius:9px;margin-bottom:8px;box-shadow:0 2px 8px #1c422b0d}.grid{display:block}.s4,.s8{width:100%}.r2{grid-template-columns:1fr 1fr;gap:6px}.date-row,.product-row{grid-template-columns:1fr;gap:3px}label{font-size:9px;margin:2px 0 3px}input,select{font-size:16px;padding:6px 7px;min-height:34px;border-radius:6px;margin-bottom:6px}.btn{padding:6px 8px;border-radius:6px;font-size:10px;min-height:32px}.actions{gap:4px}.area-total,.summary{padding:7px;border-radius:7px;margin-bottom:7px;font-size:11px}.step{padding-top:8px;margin-top:8px}.lav-list,.prod-list{grid-template-columns:1fr;gap:5px;margin-top:5px}.choice{padding:7px;border-radius:7px;font-size:11px}.choice label{font-size:11px;text-transform:none;margin:0}.choice input[type=checkbox]{transform:scale(1.02);margin-right:4px}.subhead{font-size:13px;margin:11px 0 6px}#tblLav,#tblVar,#tblPro,#tblCompras,.board{overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;border-radius:7px}table{font-size:10px;min-width:500px}th,td{padding:5px;white-space:nowrap}.board table{min-width:760px}.board th,.board td{white-space:normal;min-width:92px;padding:5px}.timeline{padding-left:10px}.event{padding:7px;margin-bottom:6px;font-size:11px}.tag{font-size:8px;padding:2px 5px}}'''
          tiny='''@media(max-width:390px){header{height:46px}.head h1{font-size:14px}.head b{font-size:5.6px}.layout{min-height:calc(100vh - 46px)}nav{padding:3px 4px}nav button{font-size:8.8px;padding:6px 6px}main{padding:6px}.card{padding:7px}.page>h2{font-size:15px}.r2{gap:5px}table{font-size:9.5px;min-width:470px}}'''

          s=re.sub(r'@media\(max-width:760px\)\{.*?\}(?=@media\(max-width:390px\))',mobile,s,count=1,flags=re.S)
          s=re.sub(r'@media\(max-width:390px\)\{.*?\}(?=@media print)',tiny,s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Gravar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Redimensiona interface para uso no iPhone"
          git push
