name: Corrigir interface mobile

on:
  push:
    paths:
      - '.github/workflows/mobile-header-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir logo e cabecalho
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Incorpora o logo dentro do HTML para nunca depender de caminho/arquivo no navegador.
          logo=base64.b64encode(Path('logo-paineira.jpg').read_bytes()).decode()
          data='data:image/jpeg;base64,'+logo
          s=re.sub(r'<img class="header-logo"[^>]*>',f'<img class="header-logo" src="{data}" alt="Logo Agropecuária Paineira">',s,count=1)

          # Corrige somente as dimensoes do cabecalho desktop, sem mexer nas telas ou dados.
          s=s.replace('header{height:140px;position:relative;display:grid;grid-template-columns:170px 1fr 190px;align-items:center;background:#fff;border-bottom:5px solid var(--y);overflow:hidden;padding:0 20px;gap:12px}',
                      'header{height:112px;position:relative;display:grid;grid-template-columns:130px minmax(0,1fr) 205px;align-items:center;background:#fff;border-bottom:4px solid var(--y);overflow:hidden;padding:0 18px;gap:14px}')
          s=s.replace('.logo-wrap{z-index:2;width:125px;height:108px;background:#fff;border-radius:15px;padding:5px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #0002}',
                      '.logo-wrap{z-index:2;width:92px;height:92px;background:#fff;border-radius:12px;padding:4px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px #0002}')
          s=s.replace('.head h1{margin:5px 0;font-size:40px;line-height:1.1;color:var(--g);white-space:nowrap}',
                      '.head h1{margin:4px 0;font-size:36px;line-height:1.05;color:var(--g);white-space:nowrap}')
          s=s.replace('.side{z-index:2;text-align:center;color:#fff;font-style:italic;font-weight:700;font-size:12px;line-height:1.35}',
                      '.side{z-index:2;text-align:center;color:#fff;font-style:italic;font-weight:700;font-size:11px;line-height:1.35;white-space:normal;padding-left:18px}')
          s=s.replace('min-height:calc(100vh - 140px)','min-height:calc(100vh - 112px)')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Gravar correcoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrige definitivamente logo e cabecalho"
          git push
