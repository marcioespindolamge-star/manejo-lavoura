name: Ajustar Variedades e Areas
on:
  push:
    paths:
      - '.github/workflows/ajustar-variedades-areas.yml'
      - 'scripts/ajustar_variedades_areas.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/ajustar_variedades_areas.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Desvincula variedade da area e padroniza termo Area"
          git push
