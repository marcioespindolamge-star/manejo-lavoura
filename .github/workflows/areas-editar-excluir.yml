name: Areas no menu com editar e excluir

on:
  push:
    paths:
      - '.github/workflows/areas-editar-excluir.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar titulo Areas e acoes Editar Excluir
        run: python .github/scripts/patch_areas.py
      - name: Conferir alteracoes
        run: |
          grep -q '🌱 Áreas' index.html
          grep -q '<h2>ÁREAS</h2>' index.html
          grep -q 'AREAS_MENU_EDIT_V1' index.html
          grep -q '>Editar</button>' index.html
          grep -q '>Excluir</button>' index.html
      - name: Salvar no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Troca titulo para Areas e mantem Editar Excluir"
          git push
