name: Corrigir Menus Agora
on:
  push:
    paths:
      - '.github/workflows/corrigir-menus-agora.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar index sem Firebase e corrigir erro que bloqueia menus
        run: |
          git checkout fae52d62f0cb2027fe7514f4efdb3ea1b7eb83c7 -- index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function opts(){let a=db.lavouras.map(x=>`<option value=\"${x.id}\">${x.nome}</option>`).join(''),vl=$('varLav').value,rl=$('relLav').value,pe=$('proExist').value;$('varLav').innerHTML='<option value=\"\">Selecione</option>'+a;if(vl)$('relLav').innerHTML='<option value=\"\">Selecione</option>'+a;if(rl)$('relLav').value=rl;"
          new="function opts(){let a=db.lavouras.map(x=>`<option value=\"${x.id}\">${x.nome}</option>`).join(''),rl=$('relLav').value,pe=$('proExist').value;$('relLav').innerHTML='<option value=\"\">Selecione</option>'+a;if(rl)$('relLav').value=rl;"
          if old not in s:
              raise SystemExit('Trecho opts nao encontrado')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restaura sistema e corrige acesso aos menus"
          git push