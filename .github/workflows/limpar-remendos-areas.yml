name: Corrigir Areas

on:
  push:
    paths:
      - '.github/workflows/limpar-remendos-areas.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcao limpa
        run: python scripts/aplicar_correcoes.py
      - name: Validar correcao
        run: |
          grep -q 'AREAS_LIMPA_V6' index.html
          ! grep -q 'renderAll()' index.html
          grep -q 'area-editar' index.html
          grep -q 'area-excluir' index.html
      - name: Publicar index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Limpa e corrige tela Areas"
          git push
