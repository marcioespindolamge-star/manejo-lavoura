name: Mostrar sacas de sementes
on:
  push:
    paths:
      - '.github/workflows/mostrar-sacas-semente.yml'
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Acrescentar sacas de 60 kg somente no total de sementes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="$('totalSementesUsadas').innerHTML='<b>TOTAL DE SEMENTES USADAS: '+totalSem.toLocaleString('pt-BR',{maximumFractionDigits:2})+' kg</b>';"
          new="$('totalSementesUsadas').innerHTML='<b>TOTAL DE SEMENTES USADAS: '+totalSem.toLocaleString('pt-BR',{maximumFractionDigits:2})+' kg — '+(totalSem/60).toLocaleString('pt-BR',{maximumFractionDigits:2})+' sacas de 60 kg</b>';"
          if old not in s:
              raise SystemExit('Total de sementes nao encontrado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Mostra sacas de 60 kg no total de sementes [skip ci]'
          git push
