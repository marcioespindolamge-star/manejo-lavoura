name: Corrigir salvamento de semente
on:
  push:
    paths:
      - '.github/workflows/corrigir-salvar-semente.yml'
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir campos de semente no salvamento da variedade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="let d={lavouraId:lid,ano,variedade:$('varNome').value.trim(),ciclo:$('varCiclo').value.trim(),obs:$('varObs').value};"
          new="let kgHa=n($('varSementeKgHa').value),areaLav=n(lav(lid)?.area);let d={lavouraId:lid,ano,variedade:$('varNome').value.trim(),ciclo:$('varCiclo').value.trim(),sementeKgHa:kgHa,sementeTotalKg:kgHa*areaLav,obs:$('varObs').value};"
          if old not in s:
              raise SystemExit('Trecho de salvamento nao encontrado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Salva semente kg ha e total na variedade [skip ci]'
          git push
