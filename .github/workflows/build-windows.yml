name: Gerar executavel Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'index.html'
      - 'logo-paineira-novo.png'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install
      - name: Gerar executavel atualizado para PC - editar excluir e brasao corrigido
        run: npm run dist
      - name: Publicar executavel para download
        uses: actions/upload-artifact@v4
        with:
          name: Manejo-da-Lavoura-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
