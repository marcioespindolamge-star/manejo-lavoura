name: Aplicar fix Areas V6
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_areas_v6.py
      - run: grep -q AREAS_UNICA_V6 index.html
      - run: git config user.name github-actions
      - run: git config user.email actions@github.com
      - run: git add index.html && git commit -m "Corrige tela Areas sem remendos" && git push
