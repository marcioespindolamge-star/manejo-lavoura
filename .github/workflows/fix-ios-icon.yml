name: Corrigir icone iPhone

on:
  push:
    paths:
      - '.github/workflows/fix-ios-icon.yml'

permissions:
  contents: write

jobs:
  fix-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar icones PNG para iPhone e navegador
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, re

          candidates = [
              Path('manejo-lavoura-icon.png'),
              Path('apple-touch-icon.png'),
              Path('icon.png'),
          ]
          src = next((p for p in candidates if p.exists()), None)
          if src is None:
              raise SystemExit('Nenhum PNG de icone encontrado no repositorio.')

          im = Image.open(src).convert('RGB')
          side = min(im.size)
          left = (im.width-side)//2
          top = (im.height-side)//2
          im = im.crop((left, top, left+side, top+side))

          def save_icon(size, name):
              out = im.resize((size,size), Image.Resampling.LANCZOS)
              out.save(name, 'PNG', optimize=True)

          save_icon(180, 'apple-touch-icon.png')
          save_icon(192, 'icon-192.png')
          save_icon(512, 'icon-512.png')
          save_icon(32, 'favicon-32.png')

          manifest = {
              'name': 'Manejo da Lavoura',
              'short_name': 'Manejo Lavoura',
              'start_url': './',
              'display': 'standalone',
              'background_color': '#ffffff',
              'theme_color': '#174d2c',
              'icons': [
                  {'src':'icon-192.png?v=2','sizes':'192x192','type':'image/png'},
                  {'src':'icon-512.png?v=2','sizes':'512x512','type':'image/png'}
              ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # remove referencias antigas para evitar o Safari escolher um icone em cache
          s = re.sub(r'<link[^>]+rel=["\'][^"\']*(?:apple-touch-icon|icon|manifest)[^"\']*["\'][^>]*>\s*', '', s, flags=re.I)
          s = re.sub(r'<meta[^>]+name=["\']apple-mobile-web-app-title["\'][^>]*>\s*', '', s, flags=re.I)
          s = re.sub(r'<meta[^>]+name=["\']apple-mobile-web-app-capable["\'][^>]*>\s*', '', s, flags=re.I)

          tags = '''\n<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260913-2">\n<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=20260913-2">\n<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=20260913-2">\n<link rel="manifest" href="./manifest.webmanifest?v=20260913-2">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-title" content="Manejo da Lavoura">\n<meta name="theme-color" content="#174d2c">\n'''
          if '</head>' not in s.lower():
              raise SystemExit('Tag </head> nao encontrada em index.html')
          s = re.sub(r'</head>', tags + '</head>', s, count=1, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Gravar correcao do icone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apple-touch-icon.png icon-192.png icon-512.png favicon-32.png manifest.webmanifest
          git diff --cached --quiet && exit 0
          git commit -m "Corrige icone do Manejo da Lavoura no iPhone"
          git push
