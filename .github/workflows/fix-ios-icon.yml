name: Corrigir icone iPhone

on:
  push:
    paths:
      - '.github/workflows/fix-ios-icon.yml'

permissions:
  contents: write

jobs:
  fix-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar icones PNG para iPhone e navegador
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 512 -h 512 manejo-lavoura-icon.svg -o manejo-lavoura-icon.png
          rsvg-convert -w 180 -h 180 manejo-lavoura-icon.svg -o apple-touch-icon.png
          rsvg-convert -w 192 -h 192 manejo-lavoura-icon.svg -o icon-192.png
          rsvg-convert -w 512 -h 512 manejo-lavoura-icon.svg -o icon-512.png
          rsvg-convert -w 32 -h 32 manejo-lavoura-icon.svg -o favicon-32.png

          python - <<'PY'
          from pathlib import Path
          import json, re

          manifest = {
              'name': 'Manejo da Lavoura',
              'short_name': 'Manejo Lavoura',
              'start_url': './',
              'display': 'standalone',
              'background_color': '#ffffff',
              'theme_color': '#174d2c',
              'icons': [
                  {'src':'icon-192.png?v=3','sizes':'192x192','type':'image/png'},
                  {'src':'icon-512.png?v=3','sizes':'512x512','type':'image/png'}
              ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<link[^>]+rel=["\'][^"\']*(?:apple-touch-icon|icon|manifest)[^"\']*["\'][^>]*>\s*', '', s, flags=re.I)
          s = re.sub(r'<meta[^>]+name=["\']apple-mobile-web-app-title["\'][^>]*>\s*', '', s, flags=re.I)
          s = re.sub(r'<meta[^>]+name=["\']apple-mobile-web-app-capable["\'][^>]*>\s*', '', s, flags=re.I)
          s = re.sub(r'<meta[^>]+name=["\']theme-color["\'][^>]*>\s*', '', s, flags=re.I)

          tags = '''\n<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260913-3">\n<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=20260913-3">\n<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=20260913-3">\n<link rel="manifest" href="./manifest.webmanifest?v=20260913-3">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-title" content="Manejo da Lavoura">\n<meta name="theme-color" content="#174d2c">\n'''
          if '</head>' not in s.lower():
              raise SystemExit('Tag </head> nao encontrada em index.html')
          s = re.sub(r'</head>', tags + '</head>', s, count=1, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Gravar correcao do icone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manejo-lavoura-icon.png apple-touch-icon.png icon-192.png icon-512.png favicon-32.png manifest.webmanifest
          git diff --cached --quiet && exit 0
          git commit -m "Corrige icone do Manejo da Lavoura no iPhone"
          git push
