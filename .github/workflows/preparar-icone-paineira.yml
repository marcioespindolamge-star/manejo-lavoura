name: Preparar icone do atalho iPhone
on:
  push:
    paths:
      - index.html
permissions:
  contents: write
jobs:
  icone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Gerar PNGs quadrados do logotipo existente
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          im=Image.open('logo-paineira-novo.png').convert('RGBA')
          for size in (180,192,512):
              icon=Image.new('RGBA',(size,size),'white')
              resized=im.copy()
              resized.thumbnail((size,size),Image.Resampling.LANCZOS)
              icon.alpha_composite(resized,((size-resized.width)//2,(size-resized.height)//2))
              icon.convert('RGB').save('paineira-atalho-'+str(size)+'.png',format='PNG',optimize=True)
          PY
      - name: Publicar somente os arquivos do icone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paineira-atalho-180.png paineira-atalho-192.png paineira-atalho-512.png
          git diff --cached --quiet || (git commit -m "Gera icones reais PNG para atalho da Paineira" && git push)
