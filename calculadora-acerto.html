<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora - Acerto de Contas</title><style>body{font-family:Arial,sans-serif;background:#f4f7f4;margin:0;padding:20px;color:#16452e}.calc{max-width:360px;margin:auto;background:white;padding:18px;border-radius:14px;box-shadow:0 2px 12px #0002}h2{text-align:center;margin:0 0 16px}#visor{box-sizing:border-box;width:100%;font-size:27px;text-align:right;padding:14px;border:1px solid #bbb;border-radius:8px;margin-bottom:12px}#teclas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{border:0;border-radius:8px;background:#e4eee7;color:#16452e;font-size:22px;font-weight:700;min-height:55px;cursor:pointer}.usar{width:100%;background:#176b46;color:white;margin-top:12px;font-size:17px}</style></head><body><div class="calc"><button type="button" onclick="voltar()" style="font-size:15px;min-height:38px;padding:6px 12px;margin-bottom:12px">← VOLTAR</button><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px"><h2 style="margin:0">CALCULADORA</h2><button type="button" onclick="voltar()" style="font-size:15px;min-height:42px;padding:0 12px;background:#e4eee7">✕ SAIR</button></div><input id="visor" value="0" readonly><div id="teclas"></div><button class="usar" onclick="usar()">USAR VALOR</button></div><script>let expr='';const visor=document.getElementById('visor');const teclas=['7','8','9','÷','4','5','6','×','1','2','3','−','C','0',',','+','='];teclas.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>tecla(t);document.getElementById('teclas').appendChild(b)});function calcular(){try{let e=expr.replace(/,/g,'.').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');let partes=e.match(/\d+(?:\.\d+)?|[+*/-]/g);if(!partes||partes.join('')!==e||partes.length>31)throw Error();let valores=[Number(partes[0])];if(!Number.isFinite(valores[0]))throw Error();for(let i=1;i<partes.length;i+=2){let op=partes[i],v=Number(partes[i+1]);if(!Number.isFinite(v))throw Error();if(op==='*'||op==='/'){let a=valores.pop();valores.push(op==='*'?a*v:a/v)}else valores.push(op,v)}let r=Number(valores[0]);for(let i=1;i<valores.length;i+=2)r+=valores[i]==='+'?valores[i+1]:-valores[i+1];if(!Number.isFinite(r))throw Error();expr=String(Math.round(r*100)/100).replace('.',',');return true}catch(e){visor.value='ERRO';return false}}function tecla(t){if(t==='C')expr='';else if(t==='='){if(!calcular())return}else expr+=t;visor.value=expr||'0'}function voltar(){if(window.opener&&!window.opener.closed){window.opener.focus();window.close();return}window.location.href='./index.html'}function voltar(){if(window.opener&&!window.opener.closed){window.close();setTimeout(()=>{location.href="./index.html"},150)}else{location.href="./index.html"}}function usar(){if(!calcular())return;let v=Number(expr.replace(',','.'));if(v<0||!window.opener||window.opener.closed){alert('Abra a calculadora pelo sistema.');return}window.opener.receberValorCalculadoraAcerto(v);window.close()}</script></body></html>
