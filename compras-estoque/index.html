<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174d2c"><title>Compras e Estoque - Agropecuária Paineira</title><style>:root{--g:#174d2c;--g2:#0f5a3b;--bg:#f3f7f4;--line:#d9e3dc;--red:#b3261e}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#24342b}header{background:#fff;border-bottom:4px solid #e3bb2e;padding:14px;text-align:center}header b{font-size:12px;letter-spacing:3px;color:var(--g)}h1{font-size:28px;margin:4px 0;color:var(--g)}nav{display:flex;gap:8px;padding:12px;max-width:1100px;margin:auto;overflow:auto}nav button,.btn{border:1px solid #cbd8d0;background:#fff;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;white-space:nowrap}nav button.active,.pri{background:var(--g);color:#fff}.danger{background:var(--red);color:#fff}.page{display:none}.page.active{display:block}main{max-width:1100px;margin:auto;padding:0 12px 30px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px #1c422b0d}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.s4{grid-column:span 4}.s8{grid-column:span 8}.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;margin:5px 0}input,select{width:100%;padding:11px;border:1px solid #ccd8d0;border-radius:8px;margin-bottom:10px}.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e3e9e5;text-align:left}th{background:#edf4ef}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.kpi b{display:block;font-size:22px;color:var(--g);margin-top:5px}.muted{color:#68776f;font-size:12px}@media(max-width:760px){h1{font-size:22px}.s4,.s8{grid-column:span 12}.r2,.cards{grid-template-columns:1fr}main{padding:0 8px 20px}.card{padding:12px;overflow:auto}nav{padding:8px}th,td{padding:7px;font-size:12px}}</style></head><body><header><b>AGROPECUÁRIA PAINEIRA</b><h1>COMPRAS E ESTOQUE</h1><small>Controle de produtos, entradas e saldo</small></header><nav><button class="active" data-p="inicio">📊 Resumo</button><button data-p="produtos">📦 Produtos</button><button data-p="compras">🛒 Compras</button><button data-p="estoque">📋 Estoque</button></nav><main><section id="inicio" class="page active"><h2>RESUMO</h2><div id="kpis" class="cards"></div></section><section id="produtos" class="page"><h2>PRODUTOS</h2><div class="grid"><div class="card s4"><form id="fProduto"><input id="pId" type="hidden"><label>Nome do produto</label><input id="pNome" required><div class="r2"><div><label>Unidade</label><select id="pUn"><option value="L">Litros</option><option value="kg">Quilos</option></select></div><div><label>Categoria</label><select id="pCat"><option>Herbicida</option><option>Fungicida</option><option>Inseticida</option><option>Adjuvante</option><option>Fertilizante</option><option>Outro</option></select></div></div><div class="actions"><button type="button" class="btn" id="pCancelar" hidden>Cancelar</button><button class="btn pri">Salvar</button></div></form></div><div class="card s8" id="tblProdutos"></div></div></section><section id="compras" class="page"><h2>COMPRAS / ENTRADAS</h2><div class="grid"><div class="card s4"><form id="fCompra"><input id="cId" type="hidden"><label>Produto</label><select id="cProduto" required></select><label>Data da compra</label><input id="cData" type="date" required><div class="r2"><div><label>Quantidade</label><input id="cQtd" type="number" step=".001" min="0.001" required></div><div><label>Valor total R$</label><input id="cValor" type="number" step=".01" min="0" required></div></div><label>Fornecedor</label><input id="cFornecedor"><label>Observação</label><input id="cObs"><div class="actions"><button type="button" class="btn" id="cCancelar" hidden>Cancelar</button><button class="btn pri">Salvar entrada</button></div></form></div><div class="card s8" id="tblCompras"></div></div></section><section id="estoque" class="page"><h2>ESTOQUE ATUAL</h2><div class="card"><p class="muted">O saldo considera as compras/entradas cadastradas neste sistema.</p><div id="tblEstoque"></div></div></section></main><script>const KEY='paineira_compras_estoque_v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"produtos":[],"compras":[]}');const $=id=>document.getElementById(id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),n=v=>Number(v||0),brl=v=>n(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),fmt=d=>d?d.split('-').reverse().join('/'):'-';function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function produto(id){return db.produtos.find(p=>p.id===id)}function saldo(id){return db.compras.filter(c=>c.produtoId===id).reduce((s,c)=>s+n(c.qtd),0)}function custo(id){const a=db.compras.filter(c=>c.produtoId===id),q=a.reduce((s,c)=>s+n(c.qtd),0),v=a.reduce((s,c)=>s+n(c.valorTotal),0);return q?v/q:0}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===b.dataset.p));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()});function render(){const opts='<option value="">Selecione</option>'+db.produtos.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>`<option value="${p.id}">${p.nome}</option>`).join('');const cv=$('cProduto').value;$('cProduto').innerHTML=opts;if(cv)$('cProduto').value=cv;$('tblProdutos').innerHTML='<table><tr><th>Produto</th><th>Categoria</th><th>Unidade</th><th>Ações</th></tr>'+db.produtos.map(p=>`<tr><td><b>${p.nome}</b></td><td>${p.categoria}</td><td>${p.unidade}</td><td><button class="btn" onclick="editarP(\'${p.id}\')">Editar</button> <button class="btn danger" onclick="excluirP(\'${p.id}\')">Excluir</button></td></tr>`).join('')+'</table>';$('tblCompras').innerHTML='<table><tr><th>Data</th><th>Produto</th><th>Qtd.</th><th>Valor total</th><th>Fornecedor</th><th>Ações</th></tr>'+db.compras.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(c=>`<tr><td>${fmt(c.data)}</td><td><b>${produto(c.produtoId)?.nome||'-'}</b></td><td>${c.qtd} ${produto(c.produtoId)?.unidade||''}</td><td>${brl(c.valorTotal)}</td><td>${c.fornecedor||'-'}</td><td><button class="btn" onclick="editarC(\'${c.id}\')">Editar</button> <button class="btn danger" onclick="excluirC(\'${c.id}\')">Excluir</button></td></tr>`).join('')+'</table>';$('tblEstoque').innerHTML='<table><tr><th>Produto</th><th>Categoria</th><th>Saldo</th><th>Valor médio</th><th>Valor em estoque</th></tr>'+db.produtos.map(p=>{let s=saldo(p.id),u=custo(p.id);return`<tr><td><b>${p.nome}</b></td><td>${p.categoria}</td><td>${s.toLocaleString('pt-BR')} ${p.unidade}</td><td>${brl(u)}/${p.unidade}</td><td><b>${brl(s*u)}</b></td></tr>`}).join('')+'</table>';const total=db.produtos.reduce((s,p)=>s+saldo(p.id)*custo(p.id),0),q=db.compras.reduce((s,c)=>s+n(c.valorTotal),0);$('kpis').innerHTML=`<div class="kpi">Produtos cadastrados<b>${db.produtos.length}</b></div><div class="kpi">Total em compras<b>${brl(q)}</b></div><div class="kpi">Valor do estoque<b>${brl(total)}</b></div>`} $('fProduto').onsubmit=e=>{e.preventDefault();let id=$('pId').value,nome=$('pNome').value.trim();if(id){let p=produto(id);p.nome=nome;p.unidade=$('pUn').value;p.categoria=$('pCat').value}else db.produtos.push({id:uid(),nome,unidade:$('pUn').value,categoria:$('pCat').value});limpaP();save()};function editarP(id){let p=produto(id);$('pId').value=id;$('pNome').value=p.nome;$('pUn').value=p.unidade;$('pCat').value=p.categoria;$('pCancelar').hidden=false}$('pCancelar').onclick=limpaP;function limpaP(){$('fProduto').reset();$('pId').value='';$('pCancelar').hidden=true}function excluirP(id){if(db.compras.some(c=>c.produtoId===id))return alert('Este produto possui compras cadastradas. Exclua as compras primeiro.');if(confirm('Excluir este produto?')){db.produtos=db.produtos.filter(p=>p.id!==id);save()}}$('fCompra').onsubmit=e=>{e.preventDefault();let id=$('cId').value,obj={produtoId:$('cProduto').value,data:$('cData').value,qtd:n($('cQtd').value),valorTotal:n($('cValor').value),fornecedor:$('cFornecedor').value.trim(),obs:$('cObs').value.trim()};if(id)Object.assign(db.compras.find(c=>c.id===id),obj);else db.compras.push({id:uid(),...obj});limpaC();save()};function editarC(id){let c=db.compras.find(x=>x.id===id);$('cId').value=id;$('cProduto').value=c.produtoId;$('cData').value=c.data;$('cQtd').value=c.qtd;$('cValor').value=c.valorTotal;$('cFornecedor').value=c.fornecedor||'';$('cObs').value=c.obs||'';$('cCancelar').hidden=false}$('cCancelar').onclick=limpaC;function limpaC(){$('fCompra').reset();$('cId').value='';$('cCancelar').hidden=true}function excluirC(id){if(confirm('Excluir esta compra/entrada?')){db.compras=db.compras.filter(c=>c.id!==id);save()}}render();</script></body></html>
