<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174d2c"><title>Compras e Estoque</title><style>:root{--g:#174d2c;--bg:#f3f7f4;--line:#d9e3dc;--red:#b3261e}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#24342b;overflow-x:hidden}header{background:#fff;border-bottom:3px solid #e3bb2e;padding:8px 48px;text-align:center;position:relative}header b{font-size:9px;letter-spacing:2px;color:var(--g)}h1{font-size:19px;margin:2px;color:var(--g)}header small{font-size:10px}.menuBtn{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:9px;background:var(--g);color:#fff;font-size:24px}.overlay{display:none;position:fixed;inset:0;background:#0006;z-index:20}.overlay.open{display:block}.side{position:fixed;left:-260px;top:0;bottom:0;width:245px;background:#fff;z-index:30;box-shadow:4px 0 20px #0002;transition:.2s;padding-top:max(16px,env(safe-area-inset-top))}.side.open{left:0}.sideTitle{padding:13px 15px;border-bottom:1px solid var(--line);color:var(--g);font-weight:800}.side button{display:flex;width:100%;gap:12px;align-items:center;border:0;border-bottom:1px solid #edf1ee;background:#fff;padding:17px 16px;text-align:left;font-size:16px;font-weight:700}.side button.active{background:var(--g);color:#fff}.ico{width:25px;text-align:center;font-size:20px}.page{display:none}.page.active{display:block}main{padding:0 7px 18px}h2{font-size:16px;text-align:center;margin:9px 0}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px}.r2{display:grid;grid-template-columns:1fr 1fr;gap:7px}label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;margin:3px 0}input,select{width:100%;min-width:0;padding:9px 8px;border:1px solid #ccd8d0;border-radius:7px;margin-bottom:7px;font-size:16px;background:#fff}.calc{background:#eaf4ed;border:1px solid #b9d5c1;border-radius:9px;padding:10px;margin:3px 0 9px;text-align:center}.calc span{font-size:10px;font-weight:700}.calc b{display:block;color:var(--g);font-size:21px;margin-top:2px}.actions{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}.btn{border:1px solid #cbd8d0;background:#fff;border-radius:8px;padding:9px 10px;font-weight:700}.pri{background:var(--g);color:#fff}.danger{background:var(--red);color:#fff}.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}.kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 5px;text-align:center;font-size:11px}.kpi b{display:block;font-size:16px;color:var(--g);margin-top:4px}.tablewrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px 5px;border-bottom:1px solid #e3e9e5;text-align:left;white-space:nowrap}th{background:#edf4ef}.tablewrap .btn{padding:6px;font-size:10px}.totalEst{font-weight:800;text-align:right;margin-top:10px;color:var(--g)}@media(min-width:700px){main{max-width:900px;margin:auto}.cards{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><button class="menuBtn" id="menuBtn">☰</button><b>AGROPECUÁRIA PAINEIRA</b><h1>COMPRAS E ESTOQUE</h1><small>Entradas, saídas e saldo real</small></header><div class="overlay" id="overlay"></div><nav class="side" id="side"><div class="sideTitle">COMPRAS E ESTOQUE</div><button class="active" data-p="inicio"><span class="ico">📊</span>Resumo</button><button data-p="compras"><span class="ico">🛒</span>Compras</button><button data-p="saidas"><span class="ico">🚜</span>Saídas / Consumo</button><button data-p="estoque"><span class="ico">📋</span>Relatório</button></nav><main><section id="inicio" class="page active"><h2>RESUMO</h2><div id="kpis" class="cards"></div></section><section id="compras" class="page"><h2>CADASTRAR COMPRA</h2><div class="card"><form id="fCompra"><input id="cId" type="hidden"><label>Nome do produto</label><input id="cProduto" required><label>Data da compra</label><input id="cData" type="date" required><div class="r2"><div><label>Quantidade</label><input id="cQtd" type="number" step=".001" min=".001" required></div><div><label>Unidade</label><select id="cUn"><option value="L">Litros</option><option value="kg">Quilos</option><option value="un">Unidades</option></select></div></div><label>Valor total da compra R$</label><input id="cValor" type="number" step=".01" min="0" required><label>Dose por hectare</label><input id="cDose" type="number" step=".001" min="0"><div class="calc"><span>VALOR POR HECTARE</span><b id="valorHa">R$ 0,00/ha</b></div><label>Fornecedor</label><input id="cFornecedor"><label>Observação</label><input id="cObs"><div class="actions"><button type="button" class="btn" id="cCancelar" hidden>Cancelar</button><button class="btn pri">Salvar compra</button></div></form></div><div class="card"><div class="tablewrap" id="tblCompras"></div></div></section><section id="saidas" class="page"><h2>SAÍDA / CONSUMO</h2><div class="card"><form id="fSaida"><label>Produto</label><select id="sProduto" required></select><label>Data</label><input id="sData" type="date" required><div class="r2"><div><label>Área aplicada (ha)</label><input id="sArea" type="number" step=".01" min="0"></div><div><label>Dose/ha</label><input id="sDose" type="number" step=".001" min="0"></div></div><label>Quantidade consumida</label><input id="sQtd" type="number" step=".001" min=".001" required><div class="calc"><span>SALDO APÓS ESTA SAÍDA</span><b id="saldoDepois">-</b></div><label>Observação</label><input id="sObs" placeholder="Ex.: Aplicação na lavoura"><div class="actions"><button class="btn pri">Registrar saída</button></div></form></div><div class="card"><div class="tablewrap" id="tblSaidas"></div></div></section><section id="estoque" class="page"><h2>RELATÓRIO</h2><div class="actions" style="margin-bottom:9px"><button class="btn pri" id="btnPrint">🖨️ Imprimir / PDF</button><button class="btn" id="btnShare">↗️ Enviar</button></div><div class="card"><div class="tablewrap" id="tblEstoque"></div><div id="totalEst" class="totalEst"></div></div></section></main><script>const KEY='paineira_compras_estoque_v1';let raw=JSON.parse(localStorage.getItem(KEY)||'{"compras":[],"saidas":[]}'),db={compras:[],saidas:raw.saidas||[]};db.compras=(raw.compras||[]).map(c=>{let p=(raw.produtos||[]).find(x=>x.id===c.produtoId);return{...c,produto:c.produto||p?.nome||'',unidade:c.unidade||p?.unidade||'L',qtd:Number(c.qtd||0),valorTotal:Number(c.valorTotal||0),dose:Number(c.dose||0)}});const $=id=>document.getElementById(id),n=v=>Number(v||0),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),brl=v=>n(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),num=v=>n(v).toLocaleString('pt-BR',{maximumFractionDigits:3}),fmt=d=>d?d.split('-').reverse().join('/'):'-';function key(nome,un){return nome.trim().toUpperCase()+'|'+un}function entradas(){let m={};db.compras.forEach(c=>{let k=key(c.produto,c.unidade);if(!m[k])m[k]={key:k,nome:c.produto,unidade:c.unidade,entrada:0,saida:0,valor:0};m[k].entrada+=n(c.qtd);m[k].valor+=n(c.valorTotal)});db.saidas.forEach(s=>{if(m[s.produtoKey])m[s.produtoKey].saida+=n(s.qtd)});return Object.values(m).map(p=>({...p,saldo:p.entrada-p.saida,custo:p.entrada?p.valor/p.entrada:0}))}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function menu(v){$('side').classList.toggle('open',v);$('overlay').classList.toggle('open',v)}$('menuBtn').onclick=()=>menu(true);$('overlay').onclick=()=>menu(false);document.querySelectorAll('.side button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===b.dataset.p));document.querySelectorAll('.side button').forEach(x=>x.classList.toggle('active',x===b));menu(false);render()});function valorHa(){let v=n($('cQtd').value)?n($('cValor').value)/n($('cQtd').value)*n($('cDose').value):0;$('valorHa').textContent=brl(v)+'/ha'}['cQtd','cValor','cDose'].forEach(x=>$(x).oninput=valorHa);function calcSaida(){let p=entradas().find(x=>x.key===$('sProduto').value);if(n($('sArea').value)>0&&n($('sDose').value)>0)$('sQtd').value=(n($('sArea').value)*n($('sDose').value)).toFixed(3).replace(/\.000$/,'');let q=n($('sQtd').value);$('saldoDepois').textContent=p?num(p.saldo-q)+' '+p.unidade:'-'}['sProduto','sArea','sDose','sQtd'].forEach(x=>$(x).oninput=calcSaida);function render(){let ps=entradas(),opts='<option value="">Selecione</option>'+ps.filter(p=>p.saldo>0).map(p=>`<option value="${p.key}">${p.nome} — saldo ${num(p.saldo)} ${p.unidade}</option>`).join(''),sv=$('sProduto').value;$('sProduto').innerHTML=opts;if(sv)$('sProduto').value=sv;$('tblCompras').innerHTML='<table><tr><th>Data</th><th>Produto</th><th>Qtd.</th><th>Dose/ha</th><th>Valor/ha</th><th>Valor total</th><th>Ações</th></tr>'+db.compras.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||'')).map(c=>`<tr><td>${fmt(c.data)}</td><td><b>${c.produto}</b></td><td>${num(c.qtd)} ${c.unidade}</td><td>${num(c.dose)} ${c.unidade}/ha</td><td>${brl(n(c.qtd)?n(c.valorTotal)/n(c.qtd)*n(c.dose):0)}</td><td>${brl(c.valorTotal)}</td><td><button class="btn" onclick="editC('${c.id}')">Editar</button> <button class="btn danger" onclick="delC('${c.id}')">Excluir</button></td></tr>`).join('')+'</table>';$('tblSaidas').innerHTML='<table><tr><th>Data</th><th>Produto</th><th>Área</th><th>Dose</th><th>Consumido</th><th>Ações</th></tr>'+db.saidas.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||'')).map(s=>{let p=ps.find(x=>x.key===s.produtoKey);return`<tr><td>${fmt(s.data)}</td><td><b>${s.produto}</b></td><td>${num(s.area)} ha</td><td>${num(s.dose)} ${s.unidade}/ha</td><td><b>${num(s.qtd)} ${s.unidade}</b></td><td><button class="btn danger" onclick="delS('${s.id}')">Excluir</button></td></tr>`}).join('')+'</table>';$('tblEstoque').innerHTML='<table><tr><th>Produto</th><th>Entradas</th><th>Saídas</th><th>Saldo atual</th><th>Valor médio</th><th>Valor estoque</th></tr>'+ps.map(p=>`<tr><td><b>${p.nome}</b></td><td>${num(p.entrada)} ${p.unidade}</td><td>${num(p.saida)} ${p.unidade}</td><td><b>${num(p.saldo)} ${p.unidade}</b></td><td>${brl(p.custo)}/${p.unidade}</td><td>${brl(Math.max(0,p.saldo)*p.custo)}</td></tr>`).join('')+'</table>';let compras=db.compras.reduce((s,c)=>s+n(c.valorTotal),0),ve=ps.reduce((s,p)=>s+Math.max(0,p.saldo)*p.custo,0);$('totalEst').textContent='VALOR ATUAL DO ESTOQUE: '+brl(ve);$('kpis').innerHTML=`<div class="kpi">Total das compras<b>${brl(compras)}</b></div><div class="kpi">Saídas registradas<b>${db.saidas.length}</b></div><div class="kpi">Produtos em estoque<b>${ps.filter(p=>p.saldo>0).length}</b></div><div class="kpi">Valor do estoque<b>${brl(ve)}</b></div>`;calcSaida()}$('fCompra').onsubmit=e=>{e.preventDefault();let id=$('cId').value,o={produto:$('cProduto').value.trim(),unidade:$('cUn').value,data:$('cData').value,qtd:n($('cQtd').value),valorTotal:n($('cValor').value),dose:n($('cDose').value),fornecedor:$('cFornecedor').value.trim(),obs:$('cObs').value.trim()};if(id)Object.assign(db.compras.find(c=>c.id===id),o);else db.compras.push({id:uid(),...o});$('fCompra').reset();$('cId').value='';$('cCancelar').hidden=true;valorHa();save()};function editC(id){let c=db.compras.find(x=>x.id===id);$('cId').value=id;$('cProduto').value=c.produto;$('cData').value=c.data;$('cQtd').value=c.qtd;$('cUn').value=c.unidade;$('cValor').value=c.valorTotal;$('cDose').value=c.dose||'';$('cFornecedor').value=c.fornecedor||'';$('cObs').value=c.obs||'';$('cCancelar').hidden=false;valorHa();window.scrollTo(0,0)}$('cCancelar').onclick=()=>{$('fCompra').reset();$('cId').value='';$('cCancelar').hidden=true;valorHa()};function delC(id){if(confirm('Excluir esta compra?')){db.compras=db.compras.filter(c=>c.id!==id);save()}}$('fSaida').onsubmit=e=>{e.preventDefault();let p=entradas().find(x=>x.key===$('sProduto').value),q=n($('sQtd').value);if(!p)return alert('Selecione o produto.');if(q>p.saldo)return alert('Quantidade maior que o saldo disponível.');db.saidas.push({id:uid(),produtoKey:p.key,produto:p.nome,unidade:p.unidade,data:$('sData').value,area:n($('sArea').value),dose:n($('sDose').value),qtd:q,obs:$('sObs').value.trim()});$('fSaida').reset();save()};function delS(id){if(confirm('Excluir esta saída?')){db.saidas=db.saidas.filter(s=>s.id!==id);save()}}function relatorioHTML(){let ps=entradas(),ve=ps.reduce((s,p)=>s+Math.max(0,p.saldo)*p.custo,0),rows=ps.map(p=>`<tr><td>${p.nome}</td><td>${num(p.entrada)} ${p.unidade}</td><td>${num(p.saida)} ${p.unidade}</td><td><b>${num(p.saldo)} ${p.unidade}</b></td><td>${brl(p.custo)}/${p.unidade}</td><td>${brl(Math.max(0,p.saldo)*p.custo)}</td></tr>`).join('');return`<!doctype html><html><head><meta charset="utf-8"><title>Relatório de Estoque</title><style>@page{size:A4 portrait;margin:12mm}body{font-family:Arial;color:#000}h1,h2,p{text-align:center;margin:4px}h1{font-size:19px}h2{font-size:16px;margin-top:12px}p{font-size:11px}table{width:100%;border-collapse:collapse;margin-top:18px;font-size:10px}th,td{border:1px solid #999;padding:7px;text-align:left}th{background:#eee}.tot{text-align:right;font-weight:bold;margin-top:12px;font-size:12px}</style></head><body><h1>AGROPECUÁRIA PAINEIRA</h1><p>Restinga Sêca - RS</p><h2>RELATÓRIO DE ESTOQUE</h2><p>Emitido em ${new Date().toLocaleDateString('pt-BR')}</p><table><tr><th>Produto</th><th>Entradas</th><th>Saídas</th><th>Saldo atual</th><th>Valor médio</th><th>Valor estoque</th></tr>${rows}</table><div class="tot">VALOR ATUAL DO ESTOQUE: ${brl(ve)}</div></body></html>`}function imprimir(){let w=window.open('','_blank');if(!w)return alert('O navegador bloqueou a impressão. Permita janelas pop-up e tente novamente.');w.document.open();w.document.write(relatorioHTML());w.document.close();w.focus();setTimeout(()=>w.print(),350)}$('btnPrint').onclick=imprimir;$('btnShare').onclick=async()=>{let ps=entradas(),txt='AGROPECUÁRIA PAINEIRA\nESTOQUE ATUAL\n\n'+ps.map(p=>p.nome+': '+num(p.saldo)+' '+p.unidade).join('\n');if(navigator.share){try{await navigator.share({title:'Estoque - Agropecuária Paineira',text:txt});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(txt);alert('Relatório copiado para envio.')}catch(e){alert(txt)}};save();</script></body></html>
