<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174d2c"><title>Compras e Estoque</title><style>:root{--g:#174d2c;--bg:#f3f7f4;--line:#d9e3dc;--red:#b3261e}*{box-sizing:border-box}html,body{margin:0;width:100%;overflow-x:hidden;font-family:Arial,sans-serif;background:var(--bg);color:#24342b}header{background:#fff;border-bottom:3px solid #e3bb2e;padding:8px 48px;text-align:center;position:relative}header b{font-size:9px;letter-spacing:2px;color:var(--g)}h1{font-size:19px;margin:2px 0;color:var(--g)}header small{font-size:10px}.menuBtn{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:9px;background:var(--g);color:#fff;font-size:24px}.overlay{display:none;position:fixed;inset:0;background:#0006;z-index:20}.overlay.open{display:block}.side{position:fixed;left:-260px;top:0;bottom:0;width:245px;background:#fff;z-index:30;box-shadow:4px 0 20px #0002;transition:.2s;padding-top:max(16px,env(safe-area-inset-top))}.side.open{left:0}.sideTitle{padding:13px 15px;border-bottom:1px solid var(--line);color:var(--g);font-weight:800}.side button{display:flex;width:100%;gap:12px;align-items:center;border:0;border-bottom:1px solid #edf1ee;background:#fff;padding:17px 16px;text-align:left;font-size:16px;font-weight:700}.side button.active{background:var(--g);color:#fff}.ico{width:25px;text-align:center;font-size:20px}.page{display:none}.page.active{display:block}main{padding:0 7px 18px}h2{font-size:16px;text-align:center;margin:9px 0}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px}.r2{display:grid;grid-template-columns:1fr 1fr;gap:7px}label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;margin:3px 0}input,select{width:100%;min-width:0;padding:9px 8px;border:1px solid #ccd8d0;border-radius:7px;margin-bottom:7px;font-size:16px;background:#fff}.actions{display:flex;justify-content:flex-end;gap:6px}.btn{border:1px solid #cbd8d0;background:#fff;border-radius:8px;padding:9px 10px;font-weight:700}.pri{background:var(--g);color:#fff}.danger{background:var(--red);color:#fff}.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}.kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 5px;text-align:center;font-size:11px}.kpi b{display:block;font-size:17px;color:var(--g);margin-top:4px}.tablewrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px 5px;border-bottom:1px solid #e3e9e5;text-align:left;white-space:nowrap}th{background:#edf4ef}.tablewrap .btn{padding:6px;font-size:10px}.muted{font-size:10px}@media(min-width:700px){main{max-width:900px;margin:auto}.cards{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><button class="menuBtn" id="menuBtn">☰</button><b>AGROPECUÁRIA PAINEIRA</b><h1>COMPRAS E ESTOQUE</h1><small>Controle de compras, quantidades e saldo</small></header><div class="overlay" id="overlay"></div><nav class="side" id="side"><div class="sideTitle">COMPRAS E ESTOQUE</div><button class="active" data-p="inicio"><span class="ico">📊</span>Resumo</button><button data-p="compras"><span class="ico">🛒</span>Compras</button><button data-p="estoque"><span class="ico">📋</span>Estoque</button></nav><main><section id="inicio" class="page active"><h2>RESUMO</h2><div id="kpis" class="cards"></div></section><section id="compras" class="page"><h2>CADASTRAR COMPRA</h2><div class="card"><form id="fCompra"><input id="cId" type="hidden"><label>Nome do produto</label><input id="cProduto" required placeholder="Digite o nome do produto"><label>Data da compra</label><input id="cData" type="date" required><div class="r2"><div><label>Quantidade</label><input id="cQtd" type="number" step=".001" min=".001" required></div><div><label>Unidade</label><select id="cUn"><option value="L">Litros</option><option value="kg">Quilos</option><option value="un">Unidades</option></select></div></div><label>Valor total da compra R$</label><input id="cValor" type="number" step=".01" min="0" required><label>Fornecedor</label><input id="cFornecedor"><label>Observação</label><input id="cObs"><div class="actions"><button type="button" class="btn" id="cCancelar" hidden>Cancelar</button><button class="btn pri">Salvar compra</button></div></form></div><div class="card"><div class="tablewrap" id="tblCompras"></div></div></section><section id="estoque" class="page"><h2>ESTOQUE ATUAL</h2><div class="card"><div class="tablewrap" id="tblEstoque"></div></div></section></main><script>const KEY='paineira_compras_estoque_v1';let antigo=JSON.parse(localStorage.getItem(KEY)||'{"produtos":[],"compras":[]}');let db={compras:[]};if(antigo.compras)db.compras=antigo.compras.map(c=>{let p=(antigo.produtos||[]).find(x=>x.id===c.produtoId);return{id:c.id,produto:c.produto||p?.nome||'',unidade:c.unidade||p?.unidade||'L',data:c.data,qtd:Number(c.qtd||0),valorTotal:Number(c.valorTotal||0),fornecedor:c.fornecedor||'',obs:c.obs||''}});const $=id=>document.getElementById(id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),n=v=>Number(v||0),brl=v=>n(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),fmt=d=>d?d.split('-').reverse().join('/'):'-';function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function menu(v){$('side').classList.toggle('open',v);$('overlay').classList.toggle('open',v)}$('menuBtn').onclick=()=>menu(true);$('overlay').onclick=()=>menu(false);document.querySelectorAll('.side button[data-p]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===b.dataset.p));document.querySelectorAll('.side button').forEach(x=>x.classList.toggle('active',x===b));menu(false);render()});function grupos(){let m={};db.compras.forEach(c=>{let k=c.produto.trim().toUpperCase()+'|'+c.unidade;if(!m[k])m[k]={nome:c.produto,unidade:c.unidade,qtd:0,valor:0};m[k].qtd+=n(c.qtd);m[k].valor+=n(c.valorTotal)});return Object.values(m)}function render(){let lista=db.compras.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||''));$('tblCompras').innerHTML='<table><tr><th>Data</th><th>Produto</th><th>Quantidade</th><th>Valor total</th><th>Fornecedor</th><th>Ações</th></tr>'+lista.map(c=>`<tr><td>${fmt(c.data)}</td><td><b>${c.produto}</b></td><td>${n(c.qtd).toLocaleString('pt-BR')} ${c.unidade}</td><td><b>${brl(c.valorTotal)}</b></td><td>${c.fornecedor||'-'}</td><td><button class="btn" onclick="editarC('${c.id}')">Editar</button> <button class="btn danger" onclick="excluirC('${c.id}')">Excluir</button></td></tr>`).join('')+'</table>';let g=grupos();$('tblEstoque').innerHTML='<table><tr><th>Produto</th><th>Quantidade</th><th>Valor comprado</th><th>Valor médio</th></tr>'+g.map(p=>`<tr><td><b>${p.nome}</b></td><td><b>${p.qtd.toLocaleString('pt-BR')} ${p.unidade}</b></td><td>${brl(p.valor)}</td><td>${brl(p.qtd?p.valor/p.qtd:0)}/${p.unidade}</td></tr>`).join('')+'</table>';let total=db.compras.reduce((s,c)=>s+n(c.valorTotal),0),qtd=db.compras.reduce((s,c)=>s+n(c.qtd),0);$('kpis').innerHTML=`<div class="kpi">Valor total das compras<b>${brl(total)}</b></div><div class="kpi">Quantidade comprada<b>${qtd.toLocaleString('pt-BR')}</b></div><div class="kpi">Compras cadastradas<b>${db.compras.length}</b></div><div class="kpi">Produtos no estoque<b>${g.length}</b></div>`}$('fCompra').onsubmit=e=>{e.preventDefault();let id=$('cId').value,o={produto:$('cProduto').value.trim(),unidade:$('cUn').value,data:$('cData').value,qtd:n($('cQtd').value),valorTotal:n($('cValor').value),fornecedor:$('cFornecedor').value.trim(),obs:$('cObs').value.trim()};if(id)Object.assign(db.compras.find(c=>c.id===id),o);else db.compras.push({id:uid(),...o});limpa();save()};function editarC(id){let c=db.compras.find(x=>x.id===id);$('cId').value=id;$('cProduto').value=c.produto;$('cData').value=c.data;$('cQtd').value=c.qtd;$('cUn').value=c.unidade;$('cValor').value=c.valorTotal;$('cFornecedor').value=c.fornecedor;$('cObs').value=c.obs;$('cCancelar').hidden=false;window.scrollTo(0,0)}function limpa(){$('fCompra').reset();$('cId').value='';$('cCancelar').hidden=true}$('cCancelar').onclick=limpa;function excluirC(id){if(confirm('Excluir esta compra?')){db.compras=db.compras.filter(c=>c.id!==id);save()}}save();</script></body></html>
