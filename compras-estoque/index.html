<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174d2c"><title>Compras e Estoque</title><style>:root{--g:#174d2c;--bg:#f3f7f4;--line:#d9e3dc;--red:#b3261e}*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;font-family:Arial,sans-serif;background:var(--bg);color:#24342b}header{background:#fff;border-bottom:3px solid #e3bb2e;padding:8px 52px 8px;text-align:center;position:relative}header b{font-size:9px;letter-spacing:2px;color:var(--g)}h1{font-size:19px;margin:2px 0;color:var(--g)}header small{font-size:10px}.menuBtn{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:9px;background:var(--g);color:#fff;font-size:24px;line-height:38px;padding:0}.overlay{display:none;position:fixed;inset:0;background:#0006;z-index:20}.overlay.open{display:block}.side{position:fixed;left:-270px;top:0;bottom:0;width:255px;background:#fff;z-index:30;box-shadow:4px 0 20px #0002;transition:left .2s;padding-top:max(16px,env(safe-area-inset-top))}.side.open{left:0}.sideTitle{padding:12px 15px 16px;border-bottom:1px solid var(--line);color:var(--g);font-weight:800;font-size:14px}.side button{display:flex;width:100%;gap:12px;align-items:center;border:0;border-bottom:1px solid #edf1ee;background:#fff;padding:16px;text-align:left;font-size:16px;font-weight:700;color:#26372e}.side button.active{background:var(--g);color:#fff}.side .ico{width:25px;text-align:center;font-size:20px}.page{display:none}.page.active{display:block}main{width:100%;padding:0 7px 18px}h2{font-size:16px;text-align:center;margin:9px 0}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px}.grid{display:block}.r2{display:grid;grid-template-columns:1fr 1fr;gap:7px}label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;margin:3px 0}input,select{width:100%;min-width:0;padding:9px 8px;border:1px solid #ccd8d0;border-radius:7px;margin-bottom:7px;font-size:16px;background:#fff}.actions{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}.btn{border:1px solid #cbd8d0;background:#fff;border-radius:8px;padding:9px 10px;font-weight:700;cursor:pointer}.pri{background:var(--g);color:#fff}.danger{background:var(--red);color:#fff}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 5px;text-align:center;font-size:10px}.kpi b{display:block;font-size:16px;color:var(--g);margin-top:4px}.muted{font-size:10px;margin:3px 0 8px}.tablewrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:6px 5px;border-bottom:1px solid #e3e9e5;text-align:left;white-space:nowrap}th{background:#edf4ef}.tablewrap .btn{padding:6px 7px;font-size:10px}@media(max-width:390px){.cards{gap:4px}.kpi{padding:7px 3px}.kpi b{font-size:14px}.r2{gap:5px}}@media(min-width:700px){main{max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:1fr 2fr;gap:12px}.card{padding:14px}}</style></head><body><header><button class="menuBtn" id="menuBtn" aria-label="Abrir menu">☰</button><b>AGROPECUÁRIA PAINEIRA</b><h1>COMPRAS E ESTOQUE</h1><small>Controle de produtos, entradas e saldo</small></header><div class="overlay" id="overlay"></div><nav class="side" id="side"><div class="sideTitle">COMPRAS E ESTOQUE</div><button class="active" data-p="inicio"><span class="ico">📊</span>Resumo</button><button data-p="produtos"><span class="ico">📦</span>Produtos</button><button data-p="compras"><span class="ico">🛒</span>Compras</button><button data-p="estoque"><span class="ico">📋</span>Estoque</button></nav><main><section id="inicio" class="page active"><h2>RESUMO</h2><div id="kpis" class="cards"></div></section><section id="produtos" class="page"><h2>PRODUTOS</h2><div class="grid"><div class="card"><form id="fProduto"><input id="pId" type="hidden"><label>Nome do produto</label><input id="pNome" required><div class="r2"><div><label>Unidade</label><select id="pUn"><option value="L">Litros</option><option value="kg">Quilos</option></select></div><div><label>Categoria</label><select id="pCat"><option>Herbicida</option><option>Fungicida</option><option>Inseticida</option><option>Adjuvante</option><option>Fertilizante</option><option>Outro</option></select></div></div><div class="actions"><button type="button" class="btn" id="pCancelar" hidden>Cancelar</button><button class="btn pri">Salvar</button></div></form></div><div class="card"><div class="tablewrap" id="tblProdutos"></div></div></div></section><section id="compras" class="page"><h2>COMPRAS / ENTRADAS</h2><div class="grid"><div class="card"><form id="fCompra"><input id="cId" type="hidden"><label>Produto</label><select id="cProduto" required></select><label>Data da compra</label><input id="cData" type="date" required><div class="r2"><div><label>Quantidade</label><input id="cQtd" type="number" step=".001" min=".001" required></div><div><label>Valor total R$</label><input id="cValor" type="number" step=".01" min="0" required></div></div><label>Fornecedor</label><input id="cFornecedor"><label>Observação</label><input id="cObs"><div class="actions"><button type="button" class="btn" id="cCancelar" hidden>Cancelar</button><button class="btn pri">Salvar entrada</button></div></form></div><div class="card"><div class="tablewrap" id="tblCompras"></div></div></div></section><section id="estoque" class="page"><h2>ESTOQUE ATUAL</h2><div class="card"><p class="muted">Saldo das compras/entradas cadastradas.</p><div class="tablewrap" id="tblEstoque"></div></div></section></main><script>const KEY='paineira_compras_estoque_v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"produtos":[],"compras":[]}');const $=id=>document.getElementById(id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),n=v=>Number(v||0),brl=v=>n(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),fmt=d=>d?d.split('-').reverse().join('/'):'-';function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function produto(id){return db.produtos.find(p=>p.id===id)}function saldo(id){return db.compras.filter(c=>c.produtoId===id).reduce((s,c)=>s+n(c.qtd),0)}function custo(id){let a=db.compras.filter(c=>c.produtoId===id),q=a.reduce((s,c)=>s+n(c.qtd),0),v=a.reduce((s,c)=>s+n(c.valorTotal),0);return q?v/q:0}function menu(open){$('side').classList.toggle('open',open);$('overlay').classList.toggle('open',open)}$('menuBtn').onclick=()=>menu(true);$('overlay').onclick=()=>menu(false);document.querySelectorAll('.side button[data-p]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===b.dataset.p));document.querySelectorAll('.side button[data-p]').forEach(x=>x.classList.toggle('active',x===b));menu(false);render()});function render(){let opts='<option value="">Selecione</option>'+db.produtos.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>`<option value="${p.id}">${p.nome}</option>`).join(''),cv=$('cProduto').value;$('cProduto').innerHTML=opts;if(cv)$('cProduto').value=cv;$('tblProdutos').innerHTML='<table><tr><th>Produto</th><th>Categoria</th><th>Un.</th><th>Ações</th></tr>'+db.produtos.map(p=>`<tr><td><b>${p.nome}</b></td><td>${p.categoria}</td><td>${p.unidade}</td><td><button class="btn" onclick="editarP(\'${p.id}\')">Editar</button> <button class="btn danger" onclick="excluirP(\'${p.id}\')">Excluir</button></td></tr>`).join('')+'</table>';$('tblCompras').innerHTML='<table><tr><th>Data</th><th>Produto</th><th>Qtd.</th><th>Valor</th><th>Fornecedor</th><th>Ações</th></tr>'+db.compras.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(c=>`<tr><td>${fmt(c.data)}</td><td><b>${produto(c.produtoId)?.nome||'-'}</b></td><td>${c.qtd} ${produto(c.produtoId)?.unidade||''}</td><td>${brl(c.valorTotal)}</td><td>${c.fornecedor||'-'}</td><td><button class="btn" onclick="editarC(\'${c.id}\')">Editar</button> <button class="btn danger" onclick="excluirC(\'${c.id}\')">Excluir</button></td></tr>`).join('')+'</table>';$('tblEstoque').innerHTML='<table><tr><th>Produto</th><th>Categoria</th><th>Saldo</th><th>Valor médio</th><th>Valor estoque</th></tr>'+db.produtos.map(p=>{let s=saldo(p.id),u=custo(p.id);return`<tr><td><b>${p.nome}</b></td><td>${p.categoria}</td><td>${s.toLocaleString('pt-BR')} ${p.unidade}</td><td>${brl(u)}/${p.unidade}</td><td><b>${brl(s*u)}</b></td></tr>`}).join('')+'</table>';let total=db.produtos.reduce((s,p)=>s+saldo(p.id)*custo(p.id),0),q=db.compras.reduce((s,c)=>s+n(c.valorTotal),0);$('kpis').innerHTML=`<div class="kpi">Produtos<b>${db.produtos.length}</b></div><div class="kpi">Compras<b>${brl(q)}</b></div><div class="kpi">Estoque<b>${brl(total)}</b></div>`}$('fProduto').onsubmit=e=>{e.preventDefault();let id=$('pId').value,nome=$('pNome').value.trim();if(id){let p=produto(id);p.nome=nome;p.unidade=$('pUn').value;p.categoria=$('pCat').value}else db.produtos.push({id:uid(),nome,unidade:$('pUn').value,categoria:$('pCat').value});limpaP();save()};function editarP(id){let p=produto(id);$('pId').value=id;$('pNome').value=p.nome;$('pUn').value=p.unidade;$('pCat').value=p.categoria;$('pCancelar').hidden=false}$('pCancelar').onclick=limpaP;function limpaP(){$('fProduto').reset();$('pId').value='';$('pCancelar').hidden=true}function excluirP(id){if(db.compras.some(c=>c.produtoId===id))return alert('Este produto possui compras cadastradas. Exclua as compras primeiro.');if(confirm('Excluir este produto?')){db.produtos=db.produtos.filter(p=>p.id!==id);save()}}$('fCompra').onsubmit=e=>{e.preventDefault();let id=$('cId').value,obj={produtoId:$('cProduto').value,data:$('cData').value,qtd:n($('cQtd').value),valorTotal:n($('cValor').value),fornecedor:$('cFornecedor').value.trim(),obs:$('cObs').value.trim()};if(id)Object.assign(db.compras.find(c=>c.id===id),obj);else db.compras.push({id:uid(),...obj});limpaC();save()};function editarC(id){let c=db.compras.find(x=>x.id===id);$('cId').value=id;$('cProduto').value=c.produtoId;$('cData').value=c.data;$('cQtd').value=c.qtd;$('cValor').value=c.valorTotal;$('cFornecedor').value=c.fornecedor||'';$('cObs').value=c.obs||'';$('cCancelar').hidden=false}$('cCancelar').onclick=limpaC;function limpaC(){$('fCompra').reset();$('cId').value='';$('cCancelar').hidden=true}function excluirC(id){if(confirm('Excluir esta compra/entrada?')){db.compras=db.compras.filter(c=>c.id!==id);save()}}render();</script></body></html>
