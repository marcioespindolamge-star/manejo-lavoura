<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Manejo Lavoura</title><style>body{font-family:Arial;margin:0;background:#f3f5f2;color:#253028}header{background:#245b38;color:white;padding:18px 28px}nav{padding:14px;background:white}nav button{margin:4px;padding:10px;border:0;border-radius:7px;cursor:pointer}.page{padding:22px}.card{background:white;padding:18px;border-radius:10px;margin-bottom:14px}input,select,textarea{padding:9px;width:100%;box-sizing:border-box;margin:5px 0 12px}.btn{padding:9px 14px;border:0;border-radius:7px}.primary{background:#245b38;color:white}.danger{background:#b33a3a;color:white}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><header><h2>MANEJO LAVOURA</h2><small>Controle de lavouras, variedades, produtos, estoque e aplicações</small></header><nav><button onclick="show('lavouras')">Lavouras</button><button onclick="show('variedades')">Variedade</button><button onclick="show('produtos')">Produtos / Estoque</button><button onclick="show('aplicacoes')">Aplicações</button></nav><main><section id="lavouras" class="page"><h2>CADASTRO DE LAVOURAS</h2><div class="card"><form id="fLav"><input type="hidden" id="lavId"><label>Código / Nome</label><input id="lavCodigo" required><label>Nome</label><input id="lavNome" required><label>Área total (ha)</label><input id="lavArea" type="number" step="0.01" required><label>Latitude</label><input id="lavLat"><label>Longitude</label><input id="lavLng"><label>Status</label><select id="lavStatus"><option value="ativa">Ativa</option><option value="inativa">Inativa</option></select><button class="btn primary">Salvar</button></form></div><div class="card" id="tblLav"></div></section><section id="variedades" class="page" hidden><h2>VARIEDADE</h2><div class="card"><form id="fVar"><input type="hidden" id="varId"><label>Lavoura</label><select id="varLav" required></select><label>Ano da safra</label><input id="varAno" placeholder="2026/2027" required><label>Cultura</label><input value="Soja" disabled><label>Variedade / Cultivar</label><input id="varNome" required><label>Data de plantio</label><input id="varPlantio" type="date"><label>Observação</label><textarea id="varObs"></textarea><button class="btn primary">Salvar</button></form></div><div class="card" id="tblVar"></div></section><section id="produtos" class="page" hidden><h2>PRODUTOS / COMPRAS / ESTOQUE</h2><div class="card"><form id="fPro"><label>Produto já cadastrado</label><select id="proExist"><option value="">+ Cadastrar novo produto</option></select><label>Nome do produto</label><input id="proNome" required><label>Unidade</label><select id="proUni"><option value="L">Litros</option><option value="kg">Quilos</option></select><label>Categoria</label><select id="proCat"><option>Herbicida</option><option>Fungicida</option><option>Inseticida</option><option>Adjuvante</option><option>Fertilizante</option><option>Outro</option></select><label>Data da compra</label><input id="comData" type="date" required><label>Quantidade</label><input id="comQtd" type="number" step="0.001" required><label>Valor total (R$)</label><input id="comValor" type="number" step="0.01" required><label>Fornecedor</label><input id="comForn"><button class="btn primary">Salvar entrada</button></form></div><div class="card" id="tblPro"></div></section><section id="aplicacoes" class="page" hidden><h2>APLICAÇÕES</h2><div class="card"><form id="fApl"><label>Data</label><input id="aplData" type="date" required><label>Lavoura</label><select id="aplLav" required></select><label>Variedade</label><select id="aplVar" required></select><label>Produto</label><select id="aplPro" required></select><label>Dose por hectare</label><input id="aplDose" type="number" step="0.001" required><label>Área aplicada (ha)</label><input id="aplArea" type="number" step="0.01" required><label>Observação</label><textarea id="aplObs"></textarea><button class="btn primary">Salvar</button></form></div><div class="card" id="tblApl"></div></section></main><script>const KEY='manejoLavouraDB_v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"lavouras":[],"safras":[],"produtos":[],"compras":[],"aplicacoes":[]}');const $=x=>document.getElementById(x),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),n=x=>Number(x||0),brl=x=>n(x).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function show(id){document.querySelectorAll('.page').forEach(x=>x.hidden=x.id!==id)}function stock(id){let c=db.compras.filter(x=>x.produtoId===id).reduce((s,x)=>s+n(x.qtd),0),u=db.aplicacoes.filter(x=>x.produtoId===id).reduce((s,x)=>s+n(x.qtdTotal),0);return c-u}function render(){let lo='<option value="">Selecione</option>'+db.lavouras.map(x=>`<option value="${x.id}">${x.nome}</option>`).join('');$('varLav').innerHTML=lo;$('aplLav').innerHTML=lo;$('proExist').innerHTML='<option value="">+ Cadastrar novo produto</option>'+db.produtos.map(x=>`<option value="${x.id}">${x.nome}</option>`).join('');$('aplPro').innerHTML='<option value="">Selecione</option>'+db.produtos.map(x=>`<option value="${x.id}">${x.nome} — ${stock(x.id)} ${x.unidade}</option>`).join('');$('tblLav').innerHTML='<table><tr><th>Código</th><th>Lavoura</th><th>Área</th></tr>'+db.lavouras.map(x=>`<tr><td>${x.codigo}</td><td>${x.nome}</td><td>${x.area} ha</td></tr>`).join('')+'</table>';$('tblVar').innerHTML='<table><tr><th>Lavoura</th><th>Ano</th><th>Variedade</th></tr>'+db.safras.map(x=>`<tr><td>${db.lavouras.find(l=>l.id===x.lavouraId)?.nome||'-'}</td><td>${x.ano}</td><td>${x.variedade}</td></tr>`).join('')+'</table>';$('tblPro').innerHTML='<table><tr><th>Produto</th><th>Unidade</th><th>Estoque</th></tr>'+db.produtos.map(x=>`<tr><td>${x.nome}</td><td>${x.unidade}</td><td>${stock(x.id)}</td></tr>`).join('')+'</table>';updateVars()}function updateVars(){let id=$('aplLav').value;$('aplVar').innerHTML='<option value="">Selecione</option>'+db.safras.filter(x=>x.lavouraId===id).map(x=>`<option value="${x.id}">${x.variedade} (${x.ano})</option>`).join('')}$('aplLav').onchange=updateVars;$('fLav').onsubmit=e=>{e.preventDefault();db.lavouras.push({id:uid(),codigo:$('lavCodigo').value,nome:$('lavNome').value,area:n($('lavArea').value),lat:$('lavLat').value,lng:$('lavLng').value,status:$('lavStatus').value});e.target.reset();save()};$('fVar').onsubmit=e=>{e.preventDefault();let l=$('varLav').value,a=$('varAno').value.trim();if(db.safras.some(x=>x.lavouraId===l&&x.ano===a)){alert('Esta lavoura já possui uma variedade cadastrada para este ano.');return}db.safras.push({id:uid(),lavouraId:l,ano:a,variedade:$('varNome').value,plantio:$('varPlantio').value,obs:$('varObs').value});e.target.reset();save()};$('proExist').onchange=()=>{let p=db.produtos.find(x=>x.id===$('proExist').value);if(p){$('proNome').value=p.nome;$('proUni').value=p.unidade;$('proCat').value=p.categoria;$('proNome').disabled=$('proUni').disabled=$('proCat').disabled=true}else{$('proNome').disabled=$('proUni').disabled=$('proCat').disabled=false;$('proNome').value=''}};$('fPro').onsubmit=e=>{e.preventDefault();let id=$('proExist').value;if(!id){let p={id:uid(),nome:$('proNome').value,unidade:$('proUni').value,categoria:$('proCat').value};db.produtos.push(p);id=p.id}db.compras.push({id:uid(),produtoId:id,data:$('comData').value,qtd:n($('comQtd').value),valorTotal:n($('comValor').value),fornecedor:$('comForn').value});e.target.reset();$('proNome').disabled=$('proUni').disabled=$('proCat').disabled=false;save()};$('fApl').onsubmit=e=>{e.preventDefault();let q=n($('aplDose').value)*n($('aplArea').value),pid=$('aplPro').value;if(q>stock(pid)){alert('Estoque insuficiente.');return}db.aplicacoes.push({id:uid(),data:$('aplData').value,lavouraId:$('aplLav').value,safraId:$('aplVar').value,produtoId:pid,dose:n($('aplDose').value),area:n($('aplArea').value),qtdTotal:q,obs:$('aplObs').value});e.target.reset();save()};render();show('lavouras');</script></body></html>
