<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Manejo Lavoura</title><style>:root{--g:#0f5a3b;--g2:#17734d;--y:#e3bb2e;--line:#d9e3dc;--danger:#b3261e}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f3f7f4;color:#24342b}header{height:96px;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#ffffff 0%,#f8fbf9 100%);border-bottom:4px solid var(--y);overflow:hidden;padding:0 20px}header:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--g);z-index:0}.logo-wrap{z-index:2;width:92px;height:92px;background:#fff;border-radius:12px;padding:4px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px #0002}.header-logo{display:block;width:100%;height:100%;object-fit:contain}.head{z-index:2;text-align:center;min-width:0;padding:8px 18px}.head b{display:block;font-size:11px;letter-spacing:4px;color:var(--g);white-space:nowrap;margin-bottom:3px}.head h1{margin:2px 0;font-size:34px;line-height:1.05;color:var(--g);white-space:nowrap}.head small{display:block;font-weight:700;color:#466253;font-size:12px;white-space:nowrap}.side{z-index:2;text-align:center;color:#fff;font-style:italic;font-weight:700;font-size:11px;line-height:1.35;white-space:normal;padding-left:18px}.layout{display:grid;grid-template-columns:238px 1fr;min-height:calc(100vh - 96px)}nav{background:linear-gradient(#0e5a3b,#0b4c33);padding:18px 10px;display:flex;flex-direction:column;gap:8px}nav button{border:0;background:transparent;padding:14px 16px;border-radius:9px;text-align:left;color:#eff8f2;font-weight:600;cursor:pointer}nav button.active{background:#ffffff21;box-shadow:inset 5px 0 var(--y)}main{padding:26px;min-width:0}.page{display:none}.page.active{display:block}.page>h2{color:#16452e}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:18px;box-shadow:0 8px 26px #1c422b14}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.s4{grid-column:span 4}.s8{grid-column:span 8}.r2{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:12px;font-weight:700;margin:5px 0 6px;text-transform:uppercase}input,select{width:100%;padding:11px;border:1px solid #ccd8d0;border-radius:9px;margin-bottom:13px}.btn{border:1px solid #cfd9d2;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer;background:#fff}.pri{background:var(--g);color:#fff}.danger{background:var(--danger);color:#fff;border-color:var(--danger)}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.muted{color:#6b7870;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border:1px solid #e3e9e5;text-align:left;vertical-align:middle}th{background:#edf4ef}.area-total,.summary{background:#edf7f0;border:1px solid #c7ddcc;border-radius:11px;padding:13px;margin-bottom:14px}.step{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.lav-list,.prod-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}.choice{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfdfb}.choice input[type=checkbox]{width:auto}.date-row,.product-row{display:grid;grid-template-columns:1fr 200px;gap:10px;align-items:center}.board{overflow:auto}.board table{min-width:1000px}.board th,.board td{text-align:center}.lavhead{background:#f2c646}.varhead{background:#b7c9b4}.tipo{background:#f4df69;font-weight:700}.date{color:#b3261e;font-weight:800}.timeline{border-left:3px solid #7eae8d;padding-left:20px}.event{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:12px}.tag{background:#e7f1ea;color:var(--g);padding:4px 8px;border-radius:15px;font-size:11px;font-weight:800}.subhead{margin:22px 0 10px;color:#16452e}@media(max-width:1050px){header{height:86px;padding:0 14px}.head h1{font-size:28px}.head b{font-size:9px;letter-spacing:2.5px}.head small{font-size:10px}.layout{grid-template-columns:205px 1fr;min-height:calc(100vh - 86px)}nav{padding:12px 8px}nav button{padding:11px 12px}main{padding:18px}.card{padding:16px}.grid{gap:14px}}@media(max-width:760px){html,body{max-width:100%;overflow-x:hidden}header{height:58px;padding:0 8px;border-bottom-width:3px}.head{padding:4px 6px}.head h1{font-size:17px;line-height:1;margin:2px 0}.head b{font-size:6.8px;letter-spacing:1.2px;margin-bottom:2px}.head small{font-size:8px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layout{display:block;min-height:calc(100vh - 58px)}nav{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;overflow:visible;white-space:normal;padding:5px 6px}nav button{min-width:0;padding:7px 3px;border-radius:7px;font-size:10.5px;line-height:1.1;text-align:center;white-space:normal}nav button.active{box-shadow:inset 0 -3px var(--y)}main{padding:10px}.page>h2{font-size:20px;margin:8px 0 12px}.card{padding:12px;border-radius:11px;margin-bottom:11px;box-shadow:0 3px 12px #1c422b10}.grid{display:block}.s4,.s8{width:100%}.r2{grid-template-columns:1fr 1fr;gap:9px}.date-row,.product-row{grid-template-columns:1fr;gap:4px}label{font-size:10px;margin:3px 0 4px}input,select{font-size:16px;padding:7px 9px;min-height:36px;border-radius:7px;margin-bottom:8px}.btn{padding:7px 9px;border-radius:7px;font-size:11px;min-height:34px}.actions{gap:5px}.area-total,.summary{padding:9px;border-radius:8px;margin-bottom:9px;font-size:12px}.step{padding-top:10px;margin-top:10px}.lav-list,.prod-list{grid-template-columns:1fr;gap:6px;margin-top:6px}.choice{padding:8px;border-radius:8px;font-size:12px}.choice label{font-size:12px;text-transform:none;margin:0}.choice input[type=checkbox]{transform:scale(1.05);margin-right:5px}.subhead{font-size:15px;margin:14px 0 7px}#tblLav,#tblVar,#tblPro,#tblCompras,.board{overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%}table{font-size:11px;min-width:560px}th,td{padding:6px;white-space:nowrap}.board table{min-width:850px}.board th,.board td{white-space:normal;min-width:105px}.timeline{padding-left:12px}.event{padding:9px;margin-bottom:8px;font-size:12px}.tag{font-size:9px;padding:3px 6px}}@media(max-width:390px){header{height:54px}.head h1{font-size:16px}.head b{font-size:6.3px}.head small{font-size:7.4px}.layout{min-height:calc(100vh - 54px)}nav button{font-size:9.5px;padding:6px 2px}main{padding:8px}.card{padding:10px}.page>h2{font-size:18px}.r2{gap:7px}}@media print{header,nav,.no-print{display:none!important}.layout{display:block}main{padding:0}.page{display:none!important}#relatorios{display:block!important}}</style></head><body><header><div class="head"><b>AGROPECUÁRIA PAINEIRA</b><h1>MANEJO LAVOURA</h1><small>Controle de manejos e aplicações por lavoura</small></div></header><div class="layout"><nav><button class="active" data-p="lavouras">🌱 Lavouras</button><button data-p="variedades">🌾 Variedade</button><button data-p="produtos">📦 Produtos / Estoque</button><button data-p="aplicacoes">🚜 Manejo</button><button data-p="relatorios">📄 Relatório por Lavoura</button></nav><main><section id="lavouras" class="page active"><h2>LAVOURAS</h2><div class="grid"><div class="card s4"><form id="fLav"><label>Código / Nome</label><input id="lavCodigo" required><label>Nome</label><input id="lavNome" required><label>Área total (ha)</label><input id="lavArea" type="number" step=".01" required><div class="actions"><button class="btn pri">Salvar</button></div></form></div><div class="card s8"><div id="totalLav" class="area-total"></div><div id="tblLav"></div></div></div></section><section id="variedades" class="page"><h2>VARIEDADE</h2><div class="grid"><div class="card s4"><form id="fVar"><input id="varEditId" type="hidden"><label>Lavoura</label><select id="varLav" required></select><label>Ano Safra</label><input id="varAno" readonly><label>Variedade / Cultivar</label><input id="varNome" required><label>Ciclo</label><input id="varCiclo" placeholder="Ex.: 120 dias"><label>Observação</label><input id="varObs"><div class="actions"><button type="button" id="varCancelar" class="btn" style="display:none" onclick="cancelarVariedade()">Cancelar</button><button class="btn pri">Salvar</button></div></form></div><div class="card s8" id="tblVar"></div></div></section><section id="produtos" class="page"><h2>PRODUTOS / ESTOQUE</h2><div class="grid"><div class="card s4"><form id="fPro"><input id="compraEditId" type="hidden"><label>Produto</label><select id="proExist"></select><label>Nome</label><input id="proNome" required><div class="r2"><div><label>Unidade</label><select id="proUni"><option value="L">Litros</option><option value="kg">Quilos</option></select></div><div><label>Categoria</label><select id="proCat"><option>Herbicida</option><option>Fungicida</option><option>Inseticida</option><option>Adjuvante</option><option>Fertilizante</option><option>Outro</option></select></div></div><label>Data da compra</label><input id="comData" type="date" required><div class="r2"><div><label>Quantidade</label><input id="comQtd" type="number" step=".001" required></div><div><label>Valor total R$</label><input id="comValor" type="number" step=".01" required></div></div><label>Fornecedor</label><input id="comForn"><div class="actions"><button type="button" id="comCancelar" class="btn" style="display:none" onclick="cancelarCompra()">Cancelar</button><button class="btn pri" id="btnSalvarEntrada">Salvar entrada</button></div></form></div><div class="card s8"><div id="tblPro"></div><h3 class="subhead">ENTRADAS DE ESTOQUE</h3><div id="tblCompras"></div></div></div></section><section id="aplicacoes" class="page"><h2>MANEJO</h2><div class="card"><h3>REGISTRAR MANEJO</h3><div class="r2"><div><label>1. Manejo</label><select id="appTipo" onchange="renderProdutos()"></select></div><div><label>Observação geral</label><input id="appObs"></div></div><div class="step"><b>2. Selecione as lavouras</b><div id="lavChoices" class="lav-list"></div></div><div class="step"><b>3. Data em cada lavoura</b><div id="datasLav"></div></div><div class="step"><b>4. APLICAÇÃO — Produtos e doses</b><div id="prodChoices" class="prod-list"></div></div><div id="appResumo" class="summary"></div><div class="actions"><button class="btn pri" onclick="salvarAplicacao()">Salvar manejo</button></div></div><h2>QUADRO DE MANEJOS</h2><div class="card"><div class="actions"><button class="btn danger" onclick="limparQuadro()">Limpar Quadro</button></div><div id="quadro" class="board"></div></div></section><section id="relatorios" class="page"><h2>RELATÓRIO POR LAVOURA</h2><div class="card no-print"><label>Lavoura</label><select id="relLav" onchange="renderRel()"></select><div class="actions"><button class="btn" onclick="window.print()">Imprimir</button><button class="btn pri" onclick="salvarPDF()">Salvar em PDF</button></div></div><div id="relatorio"></div></section></main></div><script>const KEY='manejoLavouraDB_v1',ETAPAS=['Manejo de inverno','Manejo nas Terras','Dessecação','Aplicação de Pré-emergentes','Cloreto','Plantio','Capina','1º Tratamento','2º Tratamento','3º Tratamento','4º Tratamento','5º Tratamento','Colheita'];let db=JSON.parse(localStorage.getItem(KEY)||'{"lavouras":[],"safras":[],"produtos":[],"compras":[],"aplicacoes":[]}');db.manejos=db.manejos||[];db.safras=db.safras||[];db.produtos=db.produtos||[];db.compras=db.compras||[];db.aplicacoes=db.aplicacoes||[];const $=x=>document.getElementById(x),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),n=x=>Number(x||0),fmt=d=>d?d.split('-').reverse().join('/'):'-',brl=x=>n(x).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),lav=id=>db.lavouras.find(x=>x.id===id),pro=id=>db.produtos.find(x=>x.id===id);function safraAtual(){let y=new Date().getFullYear()%100;return String(y).padStart(2,'0')+'/'+String((y+1)%100).padStart(2,'0')}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function stock(id){return db.compras.filter(x=>x.produtoId===id).reduce((s,x)=>s+n(x.qtd),0)-db.aplicacoes.filter(x=>x.produtoId===id).reduce((s,x)=>s+n(x.qtdTotal),0)}function custo(id){let a=db.compras.filter(x=>x.produtoId===id),q=a.reduce((s,x)=>s+n(x.qtd),0),v=a.reduce((s,x)=>s+n(x.valorTotal),0);return q?v/q:0}function variedade(id){return db.safras.filter(x=>x.lavouraId===id).sort((a,b)=>(b.ano||'').localeCompare(a.ano||''))[0]}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===b.dataset.p));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()});function opts(){let a=db.lavouras.map(x=>`<option value="${x.id}">${x.nome}</option>`).join(''),vl=$('varLav').value,rl=$('relLav').value,pe=$('proExist').value;$('varLav').innerHTML='<option value="">Selecione</option>'+a;if(vl)$('varLav').value=vl;$('varAno').value=$('varEditId').value?($('varAno').value||safraAtual()):safraAtual();$('relLav').innerHTML='<option value="">Selecione</option>'+a;if(rl)$('relLav').value=rl;$('proExist').innerHTML='<option value="">+ Novo produto</option>'+db.produtos.map(x=>`<option value="${x.id}">${x.nome}</option>`).join('');if(pe)$('proExist').value=pe;let at=$('appTipo').value;$('appTipo').innerHTML=ETAPAS.map(x=>`<option>${x}</option>`).join('');if(ETAPAS.includes(at))$('appTipo').value=at}function render(){opts();let ta=db.lavouras.reduce((s,x)=>s+n(x.area),0);$('totalLav').innerHTML=`<b>ÁREA TOTAL CADASTRADA: ${ta.toLocaleString('pt-BR')} ha</b>`;$('tblLav').innerHTML='<table><tr><th>Código</th><th>Lavoura</th><th>Área</th></tr>'+db.lavouras.map(x=>`<tr><td>${x.codigo}</td><td><b>${x.nome}</b></td><td>${x.area} ha</td></tr>`).join('')+'</table>';$('tblVar').innerHTML='<table><tr><th>Lavoura</th><th>Safra</th><th>Variedade</th><th>Ciclo</th><th>Ações</th></tr>'+db.safras.map(x=>`<tr><td>${lav(x.lavouraId)?.nome||'-'}</td><td>${x.ano}</td><td><b>${x.variedade}</b></td><td>${x.ciclo||'-'}</td><td><button class="btn" onclick="editarVariedade('${x.id}')">Editar</button> <button class="btn danger" onclick="excluirVariedade('${x.id}')">Excluir</button></td></tr>`).join('')+'</table>';$('tblPro').innerHTML='<table><tr><th>Produto</th><th>Categoria</th><th>Saldo</th><th>Valor unit.</th><th>Valor total</th><th>Ações</th></tr>'+db.produtos.map(x=>{let s=stock(x.id),u=custo(x.id);return`<tr><td><b>${x.nome}</b></td><td>${x.categoria}</td><td>${s.toLocaleString('pt-BR')} ${x.unidade}</td><td>${brl(u)}/${x.unidade}</td><td>${brl(s*u)}</td><td><button class="btn" onclick="editarProduto('${x.id}')">Editar produto</button> <button class="btn danger" onclick="excluirProduto('${x.id}')">Excluir</button></td></tr>`}).join('')+'</table>';$('tblCompras').innerHTML='<table><tr><th>Data</th><th>Produto</th><th>Quantidade</th><th>Valor</th><th>Fornecedor</th><th>Ações</th></tr>'+db.compras.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||'')).map(c=>`<tr><td>${fmt(c.data)}</td><td>${pro(c.produtoId)?.nome||'-'}</td><td>${c.qtd} ${pro(c.produtoId)?.unidade||''}</td><td>${brl(c.valorTotal)}</td><td>${c.fornecedor||'-'}</td><td><button class="btn" onclick="editarCompra('${c.id}')">Editar entrada</button> <button class="btn danger" onclick="excluirCompra('${c.id}')">Excluir</button></td></tr>`).join('')+'</table>';renderAplicacao();renderRel()}function editarVariedade(id){let x=db.safras.find(v=>v.id===id);if(!x)return;$('varEditId').value=x.id;$('varLav').value=x.lavouraId;$('varAno').value=x.ano;$('varNome').value=x.variedade;$('varCiclo').value=x.ciclo||'';$('varObs').value=x.obs||'';$('varCancelar').style.display='inline-block'}function cancelarVariedade(){$('fVar').reset();$('varEditId').value='';$('varCancelar').style.display='none';$('varAno').value=safraAtual()}function excluirVariedade(id){let x=db.safras.find(v=>v.id===id);if(!x||!confirm('Excluir a variedade '+x.variedade+'?'))return;db.safras=db.safras.filter(v=>v.id!==id);if($('varEditId').value===id)cancelarVariedade();save()}function editarProduto(id){let p=pro(id);if(!p)return;$('proExist').value=p.id;$('proNome').value=p.nome;$('proUni').value=p.unidade;$('proCat').value=p.categoria;$('proNome').focus()}function excluirProduto(id){let p=pro(id);if(!p)return;if(db.aplicacoes.some(a=>a.produtoId===id))return alert('Este produto já foi usado em manejo e não pode ser excluído.');if(!confirm('Excluir o produto '+p.nome+' e todas as entradas de estoque dele?'))return;db.produtos=db.produtos.filter(x=>x.id!==id);db.compras=db.compras.filter(x=>x.produtoId!==id);save()}function editarCompra(id){let c=db.compras.find(x=>x.id===id);if(!c)return;let p=pro(c.produtoId);$('compraEditId').value=c.id;$('proExist').value=c.produtoId;$('proNome').value=p?.nome||'';$('proUni').value=p?.unidade||'L';$('proCat').value=p?.categoria||'Outro';$('comData').value=c.data||'';$('comQtd').value=c.qtd;$('comValor').value=c.valorTotal;$('comForn').value=c.fornecedor||'';$('comCancelar').style.display='inline-block';$('btnSalvarEntrada').textContent='Salvar alterações'}function cancelarCompra(){$('fPro').reset();$('compraEditId').value='';$('comCancelar').style.display='none';$('btnSalvarEntrada').textContent='Salvar entrada'}function excluirCompra(id){let c=db.compras.find(x=>x.id===id);if(!c||!confirm('Excluir esta entrada de estoque?'))return;db.compras=db.compras.filter(x=>x.id!==id);if($('compraEditId').value===id)cancelarCompra();save()}function renderAplicacao(){let sel=new Set([...document.querySelectorAll('.lavck:checked')].map(x=>x.value));$('lavChoices').innerHTML=db.lavouras.map(l=>`<div class="choice"><label><input type="checkbox" class="lavck" value="${l.id}" ${sel.has(l.id)?'checked':''} onchange="renderDatas();calcResumo()"> ${l.nome} — ${l.area} ha</label></div>`).join('');renderDatas();renderProdutos();renderQuadro();calcResumo()}function renderDatas(){let s=[...document.querySelectorAll('.lavck:checked')].map(x=>x.value);$('datasLav').innerHTML=s.map(id=>`<div class="date-row"><b>${lav(id)?.nome}</b><input type="date" id="date_${id}"></div>`).join('')||'<span class="muted">Selecione as lavouras.</span>'}function renderProdutos(){let tipo=$('appTipo').value,ps=db.produtos;if(/tratamento/i.test(tipo))ps=ps.filter(p=>['Fungicida','Inseticida','Adjuvante','Outro'].includes(p.categoria));else if(/desseca|capina|pré-emerg/i.test(tipo))ps=ps.filter(p=>['Herbicida','Adjuvante','Inseticida','Outro'].includes(p.categoria));$('prodChoices').innerHTML=ps.map(p=>`<div class="choice product-row"><label><input type="checkbox" class="prodck" value="${p.id}" onchange="calcResumo()"> ${p.nome}</label><input id="dose_${p.id}" type="number" step=".001" placeholder="Dose/ha ${p.unidade}" oninput="calcResumo()"></div>`).join('')||'<span class="muted">Manejo sem aplicação.</span>';calcResumo()}function calcResumo(){let ha=[...document.querySelectorAll('.lavck:checked')].reduce((s,x)=>s+n(lav(x.value)?.area),0),ch=0;document.querySelectorAll('.prodck:checked').forEach(x=>ch+=n($('dose_'+x.value)?.value)*custo(x.value));$('appResumo').innerHTML=`Área: <b>${ha} ha</b> | Custo/ha: <b>${brl(ch)}</b> | Total: <b>${brl(ch*ha)}</b>`}function salvarAplicacao(){let tipo=$('appTipo').value,ls=[...document.querySelectorAll('.lavck:checked')].map(x=>lav(x.value)),ps=[...document.querySelectorAll('.prodck:checked')].map(x=>pro(x.value));if(!ls.length)return alert('Selecione pelo menos uma lavoura.');for(let l of ls)if(!$('date_'+l.id)?.value)return alert('Informe a data de '+l.nome);let cid=uid(),obs=$('appObs').value.trim();ls.forEach(l=>{let data=$('date_'+l.id).value;if(ps.length)ps.forEach(p=>{let d=n($('dose_'+p.id).value);if(d>0)db.aplicacoes.push({id:uid(),cronogramaId:cid,data,tipoManejo:tipo,etapa:tipo,cronObs:obs,lavouraId:l.id,produtoId:p.id,dose:d,area:n(l.area),qtdTotal:d*n(l.area),valorUnitario:custo(p.id)})});else db.manejos.push({id:uid(),lavouraId:l.id,data,tipo,descricao:obs,custo:0,obs})});save();alert('Manejo salvo.')}function renderQuadro(){let ls=db.lavouras;if(!ls.length)return $('quadro').innerHTML='';let h='<table><tr><th>MANEJO</th>'+ls.map(l=>`<th class="lavhead">${l.area}ha ${l.nome}</th>`).join('')+'</tr><tr><td>VARIEDADE</td>'+ls.map(l=>`<td class="varhead">${variedade(l.id)?.variedade||'-'}</td>`).join('')+'</tr>';ETAPAS.forEach(t=>{h+=`<tr><td class="tipo">${t}</td>`+ls.map(l=>{let z=[];db.manejos.filter(m=>m.lavouraId===l.id&&m.tipo===t).forEach(m=>z.push({data:m.data,txt:m.descricao||t}));let g={};db.aplicacoes.filter(a=>a.lavouraId===l.id&&(a.tipoManejo===t||a.etapa===t)).forEach(a=>(g[a.cronogramaId||a.id]??=[]).push(a));Object.values(g).forEach(a=>z.push({data:a[0].data,txt:a.map(x=>`${pro(x.produtoId)?.nome||'-'}: ${x.dose}`).join('<br>')}));return`<td>${z.map(x=>`<div class="date">${fmt(x.data)}</div>${x.txt}`).join('<hr>')||'—'}</td>`}).join('')+'</tr>'});$('quadro').innerHTML=h+'</table>'}function limparQuadro(){if(!confirm('Tem certeza que deseja limpar todo o quadro de manejos?'))return;db.manejos=[];db.aplicacoes=[];save()}function renderRel(){let id=$('relLav').value;if(!id)return $('relatorio').innerHTML='<div class="card muted">Selecione uma lavoura.</div>';let l=lav(id),v=variedade(id),ev=[];db.manejos.filter(x=>x.lavouraId===id).forEach(x=>ev.push({data:x.data,tipo:x.tipo,txt:x.descricao||x.obs||'',ct:n(x.custo)}));let g={};db.aplicacoes.filter(x=>x.lavouraId===id).forEach(a=>(g[a.cronogramaId||a.id]??=[]).push(a));Object.values(g).forEach(a=>ev.push({data:a[0].data,tipo:a[0].tipoManejo||a[0].etapa||'Aplicação',txt:a.map(x=>{let p=pro(x.produtoId),u=x.valorUnitario??custo(x.produtoId);return`${p?.nome||'-'}: ${x.dose} ${p?.unidade||''}/ha — ${brl(x.dose*u)}/ha`}).join('<br>'),ct:a.reduce((s,x)=>s+n(x.qtdTotal)*(x.valorUnitario??custo(x.produtoId)),0)}));ev.sort((a,b)=>(a.data||'').localeCompare(b.data||''));$('relatorio').innerHTML=`<div class="card"><h2>${l.nome} — ${l.area} ha</h2><b>${v?.variedade||''}</b>${v?.ciclo?' • Ciclo: '+v.ciclo:''}</div><div class="timeline">${ev.map(x=>`<div class="event"><span class="tag">${x.tipo}</span> <b>${fmt(x.data)}</b><div>${x.txt}</div>${x.ct?'<b>'+brl(x.ct)+'</b>':''}</div>`).join('')||'<div class="event">Sem registros.</div>'}</div>`}function salvarPDF(){if(!$('relLav').value)return alert('Selecione uma lavoura.');window.print()}$('fLav').onsubmit=e=>{e.preventDefault();db.lavouras.push({id:uid(),codigo:$('lavCodigo').value.trim(),nome:$('lavNome').value.trim(),area:n($('lavArea').value)});e.target.reset();save()};$('fVar').onsubmit=e=>{e.preventDefault();let id=$('varEditId').value,ano=$('varAno').value||safraAtual(),lid=$('varLav').value;if(db.safras.some(x=>x.lavouraId===lid&&x.ano===ano&&x.id!==id))return alert('Já existe variedade desta lavoura nesta safra.');let d={lavouraId:lid,ano,variedade:$('varNome').value.trim(),ciclo:$('varCiclo').value.trim(),obs:$('varObs').value};if(id)Object.assign(db.safras.find(v=>v.id===id),d);else db.safras.push({id:uid(),...d});cancelarVariedade();save()};$('proExist').onchange=()=>{let p=pro($('proExist').value);if(p){$('proNome').value=p.nome;$('proUni').value=p.unidade;$('proCat').value=p.categoria}else{$('proNome').value=''}};$('fPro').onsubmit=e=>{e.preventDefault();let edit=$('compraEditId').value,p=pro($('proExist').value);if(!p){p={id:uid(),nome:$('proNome').value.trim(),unidade:$('proUni').value,categoria:$('proCat').value};db.produtos.push(p)}else{p.nome=$('proNome').value.trim();p.unidade=$('proUni').value;p.categoria=$('proCat').value}let d={produtoId:p.id,data:$('comData').value,qtd:n($('comQtd').value),valorTotal:n($('comValor').value),fornecedor:$('comForn').value.trim()};if(edit)Object.assign(db.compras.find(x=>x.id===edit),d);else db.compras.push({id:uid(),...d});cancelarCompra();save()};render();</script></body></html>
